        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Optional item filter.
        to:
          $ref: '#/components/schemas/Revision'
          description: Compared version.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - from
      - to
      type: object
    DiffResponse:
      additionalProperties: false
      description: A comparison tied to both source revisions.
      properties:
        changes:
          description: Changed content.
          items:
            $ref: '#/components/schemas/FileChange'
          type: array
        from:
          $ref: '#/components/schemas/Revision'
          description: Base commit.
        to:
          $ref: '#/components/schemas/Revision'
          description: Compared commit.
        warnings:
          description: Limits or unsupported binary comparison details.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - from
      - to
      - changes
      - warnings
      type: object
    Digest:
      pattern: ^[0-9a-f]{64}$
      type: string
    DiscardDraftRequest:
      additionalProperties: false
      description: Remove the caller's own draft of one item.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
