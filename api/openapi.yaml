          type:
          - integer
          - 'null'
        object:
          $ref: '#/components/schemas/Digest'
          description: Referenced object.
        offset:
          description: Decimal byte offset.
          type:
          - string
          - 'null'
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Authorized provenance path.
      required:
      - source
      - object
      type: object
    GetObjectResponse:
      additionalProperties: false
      description: An authorized bounded binary block.
      properties:
        data_base64:
          description: Bounded base64 block; large objects use the streaming route.
          type: string
        has_more:
          description: Whether more bytes remain.
          type: boolean
        media_type:
          description: Content type.
          type: string
        offset:
          description: Actual byte offset.
          type: string
        sha256:
          $ref: '#/components/schemas/Digest'
          description: Whole-object digest.
        total_size:
          description: Whole-object size.
          type: string
      required:
      - sha256
      - offset
      - total_size
      - media_type
      - data_base64
      - has_more
      type: object
    GetProposalRequest:
      additionalProperties: false
      description: Open one proposal and its exact content.
      properties:
        proposal_id:
