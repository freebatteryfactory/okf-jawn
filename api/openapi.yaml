          minimum: 0
          type: integer
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - max_nodes
      type: object
    GetGraphResponse:
      additionalProperties: false
      description: Graph nodes and edges from the same authorized revision.
