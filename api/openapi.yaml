        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved version.
        sources:
          description: Supporting citations.
          items:
            $ref: '#/components/schemas/SourceReference'
          type: array
      required:
      - revision
      - sources
      type: object
    GetTenantJobRequest:
      additionalProperties: false
      description: 'Read one installation-level job: an installation backup or a purge.'
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
          description: Job identity.
      required:
      - job_id
      type: object
    GetViewRequest:
      additionalProperties: false
      description: Read a stored visual artifact at its selected revision.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      type: object
    HealthRequest:
      additionalProperties: false
