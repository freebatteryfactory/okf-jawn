      properties:
        purge_id:
          $ref: '#/components/schemas/PurgeId'
          description: Purge identity.
      required:
      - purge_id
      type: object
    GetReceiptRequest:
      additionalProperties: false
      description: Inspect one durable record within workspace permissions.
      properties:
        receipt_id:
          $ref: '#/components/schemas/ReceiptId'
          description: Receipt identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - receipt_id
      type: object
    GetRulesRequest:
      additionalProperties: false
      description: Read the workspace conventions at one version.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      type: object
    GetSourcesRequest:
      additionalProperties: false
      description: Retrieve sources and provenance for one item.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      type: object
    GetSourcesResponse:
      additionalProperties: false
      description: Citations and source appearances for the selected item.
      properties:
        appearance:
          anyOf:
          - $ref: '#/components/schemas/SourceAppearance'
          - type: 'null'
