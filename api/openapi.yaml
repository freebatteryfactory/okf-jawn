components:
  schemas:
    AcceptProposalRequest:
      additionalProperties: false
      description: Accept exactly the displayed proposal against an unchanged workspace head.
      properties:
        confirmation_id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Server-issued session-bound confirmation; never a model-supplied reviewer name.
        expected_head:
          $ref: '#/components/schemas/Revision'
          description: Workspace head shown during confirmation.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity; a retry with the same mutation may re-consume its own confirmation.
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: Suggestion identity.
        proposal_revision:
          $ref: '#/components/schemas/Revision'
          description: Proposal version shown during confirmation.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - proposal_id
      - expected_head
      - proposal_revision
      - confirmation_id
      - idempotency_key
      type: object
    AccessRoute:
      description: |-
        How authenticated authority reached the application.

        Local and hosted entry paths both resolve to one of these routes and share the same
        authorization rules; no route is granted authority because the connection is loopback.
      oneOf:
      - const: browser_session
        description: Hosted Explorer session established through WorkOS AuthKit.
        type: string
      - const: mcp_delegation
        description: 'External agent: a WorkOS Connect token when hosted, a local connector credential when local.'
        type: string
      - const: local_owner
        description: The installation-local owner identity, authenticated through the local browser session.
        type: string
      - const: service
        description: Configured internal service identity.
        type: string
    AddCommentRequest:
      additionalProperties: false
      description: Add a discussion comment without recording content verification.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: Suggestion being discussed.
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceReference'
          - type: 'null'
          description: Optional line or range under discussion; the caller must be able to read it.
        text:
          description: Comment text.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - proposal_id
      - text
      - idempotency_key
      type: object
    ApiError:
      additionalProperties: false
      description: A safe error response, not an internal backtrace.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable code for programmatic handling.
        detail:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
          description: Typed context for conflict, replay, and in-progress outcomes.
        field:
          description: Input field needing correction.
          type:
          - string
          - 'null'
        message:
          description: Safe explanation for the caller.
          type: string
        request_id:
          description: Correlation identifier, not a secret.
          type:
          - string
          - 'null'
      required:
      - code
      - message
      type: object
    ApplyNamesRequest:
      additionalProperties: false
      description: Apply a revision-bound preview and rewrite affected links.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        plan:
          $ref: '#/components/schemas/RenamePlan'
          description: Plan revalidated before any writes.
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Rules whose digest must match the preview.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - plan
      - rules
      - idempotency_key
      type: object
    ArchiveWorkspaceRequest:
      additionalProperties: false
      description: Archive the workspace without deleting retained content.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - idempotency_key
      type: object
    ArtifactId:
      description: Identity of a retained export or backup artifact.
      format: uuid
      type: string
    At:
      description: A requested version selector; resolved responses contain a `Revision` instead.
      oneOf:
      - additionalProperties: false
        description: Resolve the current accepted workspace head exactly once.
        properties:
          kind:
            const: latest
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Read an explicitly identified historical snapshot.
        properties:
          kind:
            const: revision
            type: string
          revision:
            $ref: '#/components/schemas/Revision'
            description: Exact resolved commit identity.
        required:
        - kind
        - revision
        type: object
    AttentionItem:
      additionalProperties: false
      description: An observation with a useful next action.
      properties:
        action:
          $ref: '#/components/schemas/OperationName'
          description: Suggested existing operation, never executable code.
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Relevant item.
        kind:
          $ref: '#/components/schemas/AttentionKind'
          description: Diagnostic class.
        message:
          description: Concrete explanation.
          type: string
      required:
      - kind
      - message
      - action
      type: object
    AttentionKind:
      description: Known maintenance conditions.
      oneOf:
      - const: broken_link
        description: A reference does not resolve.
        type: string
      - const: stale
        description: '`stale_after` requires checking.'
        type: string
      - const: unreviewed
        description: Agent-authored content has no covering review.
        type: string
      - const: duplicate
        description: Identical bytes have multiple visible appearances.
        type: string
      - const: missing_description
        description: Navigation summary is absent.
        type: string
      - const: extraction
        description: Extraction has warnings or failed.
        type: string
      - const: newer_source
        description: A pinned View has newer source data available.
        type: string
      - const: instruction_like
        description: Possible instruction-like source text; advisory only.
        type: string
    BackupWorkspaceRequest:
      additionalProperties: false
      description: Back up content plus application records; distinct from portable export.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity for the backup.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - idempotency_key
      type: object
    BlameLine:
      additionalProperties: false
      description: A line and its last recorded content change.
      properties:
        commit:
          $ref: '#/components/schemas/Commit'
          description: Last recorded change.
        line:
          description: One-based line.
          format: uint32
          minimum: 0
          type: integer
        text:
          description: Current text at the selected version.
          type: string
      required:
      - line
      - text
      - commit
      type: object
    BlameRequest:
      additionalProperties: false
      description: Show which commit last changed lines, not who originated each fact.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        lines:
          $ref: '#/components/schemas/TextRange'
          description: Bounded lines.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - lines
      type: object
    BlameResponse:
      additionalProperties: false
      description: Line attribution at an explicit revision.
      properties:
        lines:
          description: Attribution records.
          items:
            $ref: '#/components/schemas/BlameLine'
          type: array
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Selected source.
      required:
      - source
      - lines
      type: object
    CancelJobRequest:
      additionalProperties: false
      description: Cancel pending or running work without discarding the uploaded original.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        job_id:
          $ref: '#/components/schemas/JobId'
          description: Job to cancel.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - job_id
      - idempotency_key
      type: object
    CatalogComponent:
      additionalProperties: false
      description: A renderer component with typed props and named supported actions.
      properties:
        actions:
          description: Allowed existing operations.
          items:
            type: string
          type: array
        description:
          description: When to use it.
          type: string
        name:
          description: Canonical component name.
          type: string
        properties_schema:
          description: JSON Schema for props.
      required:
      - name
      - description
      - properties_schema
      - actions
      type: object
    CatalogResponse:
      additionalProperties: false
      description: The presentation vocabulary; it grants no permissions.
      properties:
        components:
          description: Approved components.
          items:
            $ref: '#/components/schemas/CatalogComponent'
          type: array
        schema_version:
          description: Catalog version.
          format: uint32
          minimum: 0
          type: integer
        view_schema:
          description: Schema for persisted View documents.
      required:
      - schema_version
      - components
      - view_schema
      type: object
    CellRange:
      additionalProperties: false
      description: A one-based rectangular spreadsheet selection.
      properties:
        column_end:
          description: Last column, inclusive.
          format: uint32
          minimum: 0
          type: integer
        column_start:
          description: First column, inclusive.
          format: uint32
          minimum: 0
          type: integer
        row_end:
          description: Last row, inclusive.
          format: uint32
          minimum: 0
          type: integer
        row_start:
          description: First row, inclusive.
          format: uint32
          minimum: 0
          type: integer
        sheet:
          description: Exact sheet name.
          type: string
      required:
      - sheet
      - row_start
      - row_end
      - column_start
      - column_end
      type: object
    Change:
      description: Permitted proposal mutations; no review or acceptance variants exist.
      oneOf:
      - additionalProperties: false
        description: Create a note or View with retained properties.
        properties:
          body:
            description: Body.
            type: string
          kind:
            const: create
            type: string
          path:
            $ref: '#/components/schemas/WorkspacePath'
            description: Path.
          properties:
            additionalProperties: true
            description: Properties.
            type: object
          type_name:
            description: Type name.
            type: string
        required:
        - kind
        - path
        - type_name
        - body
        - properties
        type: object
      - additionalProperties: false
        description: Replace authored content with preconditions.
        properties:
          body:
            description: Body.
            type: string
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: edit
            type: string
          properties:
            additionalProperties: true
            description: Properties.
            type: object
        required:
        - kind
        - item_id
        - body
        - properties
        type: object
      - additionalProperties: false
        description: Move and rewrite links.
        properties:
          destination:
            $ref: '#/components/schemas/WorkspacePath'
            description: Destination.
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: move
            type: string
        required:
        - kind
        - item_id
        - destination
        type: object
      - additionalProperties: false
        description: Retire an item without deleting retained objects.
        properties:
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: archive
            type: string
        required:
        - kind
        - item_id
        type: object
    CollisionPolicy:
      description: How proposed naming collisions are handled.
      oneOf:
      - const: reject
        description: Require an explicit decision.
        type: string
      - const: suffix
        description: Add a deterministic suffix.
        type: string
      - const: keep_existing
        description: Keep the original name and report the collision.
        type: string
    Comment:
      additionalProperties: false
      description: A server-attributed discussion entry.
      properties:
        author:
          description: Authenticated subject.
          type: string
        created_at:
          description: RFC 3339 timestamp.
          type: string
        id:
          description: Comment identity.
          type: string
        text:
          description: Discussion text.
          type: string
      required:
      - id
      - author
      - text
      - created_at
      type: object
    Commit:
      additionalProperties: false
      description: A content snapshot, not a complete application event log.
      properties:
        author:
          description: Git author label, not verified human identity.
          type: string
        committed_at:
          description: RFC 3339 commit timestamp.
          type: string
        message:
          description: Commit message.
          type: string
        parents:
          description: Parent commits.
          items:
            $ref: '#/components/schemas/Revision'
          type: array
        revision:
          $ref: '#/components/schemas/Revision'
          description: Commit identity.
      required:
      - revision
      - parents
      - message
      - author
      - committed_at
      type: object
    CommitRequest:
      additionalProperties: false
      description: |-
        Snapshot the caller's drafts of the selected items in one commit.

        Each draft's own base revision is the precondition. The Snapshot is blocked only when an
        item being snapshotted was itself changed or deleted since its draft's base; head movement
        that did not touch a selected item never blocks. When blocked, nothing is committed and the
        `draft_conflict` error detail lists every conflicting item, not only the first. On success
        the snapshotted drafts are removed.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_ids:
          description: Items whose drafts by the caller are snapshotted together.
          items:
            $ref: '#/components/schemas/ItemId'
          minItems: 1
          type: array
        message:
          description: Human-readable snapshot name.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_ids
      - message
      - idempotency_key
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      description: Verify upload length and hash without silently creating duplicate occurrences.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        sha256:
          $ref: '#/components/schemas/Digest'
          description: Expected full-content hash.
        upload_id:
          $ref: '#/components/schemas/UploadId'
          description: Upload to finalize.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - upload_id
      - sha256
      - idempotency_key
      type: object
    Confirmation:
      additionalProperties: false
      description: A short-lived challenge; issuance alone is not a review.
      properties:
        expires_at:
          description: RFC 3339 expiration.
          type: string
        id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Opaque session-bound challenge.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Bound revision.
      required:
      - id
      - expires_at
      - revision
      type: object
    ConfirmationAction:
      description: The explicit human action a confirmation authorizes; never an arbitrary method.
      oneOf:
      - const: review
        description: Record a content review; requires the review permission.
        type: string
      - const: accept_proposal
        description: Accept a proposal; requires the approve permission.
        type: string
    ConfirmationId:
      description: Identity of one session-bound human confirmation challenge.
      format: uuid
      type: string
    ConfirmationTarget:
      description: The immutable object a confirmation is bound to.
      oneOf:
      - additionalProperties: false
        description: An item revision being reviewed.
        properties:
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Reviewed item.
          kind:
            const: item
            type: string
        required:
        - kind
        - item_id
        type: object
      - additionalProperties: false
        description: A proposal revision being accepted.
        properties:
          kind:
            const: proposal
            type: string
          proposal_id:
            $ref: '#/components/schemas/ProposalId'
            description: Accepted proposal.
        required:
        - kind
        - proposal_id
        type: object
    Connector:
      additionalProperties: false
      description: A local MCP connector credential's scope, without its secret.
      properties:
        connector_id:
          $ref: '#/components/schemas/ConnectorId'
          description: Stable connector identity.
        created_at:
          description: RFC 3339 issue time.
          type: string
        label:
          description: Owner-chosen name.
          type: string
        permissions:
          description: 'Granted capabilities: `read`, plus `propose` only when enabled.'
          items:
            $ref: '#/components/schemas/Permission'
          type: array
        revoked_at:
          description: RFC 3339 revocation time; a revoked connector authenticates nothing.
          type:
          - string
          - 'null'
        workspace_ids:
          description: Workspaces the connector may access.
          items:
            $ref: '#/components/schemas/WorkspaceId'
          type: array
      required:
      - connector_id
      - label
      - workspace_ids
      - permissions
      - created_at
      type: object
    ConnectorId:
      description: Identity of one local MCP connector credential, never the owner's browser session.
      format: uuid
      type: string
    CorrectDigestRequest:
      additionalProperties: false
      description: Record human corrections separately from the generated extraction.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        corrected_markdown:
          description: Corrected text kept separate from generated text.
          type: string
        digest:
          $ref: '#/components/schemas/Digest'
          description: Digest being corrected.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - digest
      - corrected_markdown
      - idempotency_key
      type: object
    CreateConfirmationRequest:
      additionalProperties: false
      description: Prepare explicit human confirmation bound to an action and immutable target.
      properties:
        action:
          $ref: '#/components/schemas/ConfirmationAction'
          description: Confirmed action; it determines the required permission.
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Displayed content digest.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Displayed content revision.
        target:
          $ref: '#/components/schemas/ConfirmationTarget'
          description: Item or proposal being confirmed.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - action
      - target
      - revision
      - content_digest
      - idempotency_key
      type: object
    CreateConnectorRequest:
      additionalProperties: false
      description: Issue a scoped credential for a local MCP client; read-only unless propose is enabled.
      properties:
        allow_propose:
          description: Also grant proposal creation. Review and approval are never grantable to a connector.
          type: boolean
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity; a replay returns `already_issued`, never the secret again.
        label:
          description: Owner-chosen name identifying the client, such as the host application.
          type: string
        workspace_ids:
          description: Workspaces the connector may read; each must already be accessible to the owner.
          items:
            $ref: '#/components/schemas/WorkspaceId'
          type: array
      required:
      - label
      - workspace_ids
      - allow_propose
      - idempotency_key
      type: object
    CreateFolderRequest:
      additionalProperties: false
      description: Create a user-selected folder and its navigable index.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        folder:
          $ref: '#/components/schemas/WorkspacePath'
          description: New relative folder path.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - folder
      - idempotency_key
      type: object
    CreateItemRequest:
      additionalProperties: false
      description: Create a note or View without altering source bytes.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        body:
          description: Markdown content.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        kind:
          $ref: '#/components/schemas/ItemKind'
          description: Built-in role.
        path:
          $ref: '#/components/schemas/WorkspacePath'
          description: Destination relative path.
        properties:
          additionalProperties: true
          description: Preserved extension properties.
          type: object
        title:
          description: Display title.
          type: string
        type_name:
          description: User-selected OKF type.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - path
      - title
      - type_name
      - kind
      - body
      - properties
      - idempotency_key
      type: object
    CreateReviewRequest:
      additionalProperties: false
      description: Record an explicit review of a displayed revision, without approving its business claims.
      properties:
        confirmation_id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Session-bound confirmation issued for this revision.
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest displayed in the review confirmation.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Exact source shown.
      required:
      - source
      - content_digest
      - confirmation_id
      - idempotency_key
      type: object
    CreateSandboxCapabilityRequest:
      additionalProperties: false
      description: Request a short-lived sandbox-origin URL for one hostile representation.
      properties:
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        object:
          $ref: '#/components/schemas/Digest'
          description: Original or derived object served; it must belong to this item revision.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Exact resolved revision whose representation is served.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - revision
      - object
      type: object
    CreateUploadRequest:
      additionalProperties: false
      description: Register immutable upload intent before streaming bytes.
      properties:
        filename:
          description: Original filename, preserved.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        relative_path:
          description: Supplied folder context.
          type: string
        sha256:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Expected content hash if caller knows it.
        size:
          description: Expected decimal byte count.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - filename
      - relative_path
      - size
      - idempotency_key
      type: object
    CreateWorkspaceRequest:
      additionalProperties: false
      description: Create a blank workspace without baked-in example content.
      properties:
        description:
          description: Purpose of this workspace.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Caller-chosen retry identity.
        name:
          description: Display name.
          type: string
      required:
      - name
      - description
      - idempotency_key
      type: object
    DateOrder:
      description: Declared date interpretation; ambiguous input is not guessed.
      oneOf:
      - const: ymd
        description: Year, month, day.
        type: string
      - const: mdy
        description: Month, day, year.
        type: string
      - const: dmy
        description: Day, month, year.
        type: string
      - const: reject_ambiguous
        description: Require unambiguous dates or a human choice.
        type: string
    DeclineProposalRequest:
      additionalProperties: false
