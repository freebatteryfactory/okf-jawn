    OutlineEntry:
      additionalProperties: false
      description: A navigable structural element from a document.
      properties:
        kind:
          $ref: '#/components/schemas/OutlineEntryKind'
          description: Structural element type.
        label:
          description: Visible heading or media caption.
          type: string
        level:
          description: Heading depth or zero for non-heading elements.
          format: uint16
          maximum: 65535
          minimum: 0
          type: integer
        selection:
          $ref: '#/components/schemas/Selection'
          description: Precise location to request next.
      required:
      - label
      - level
      - selection
      - kind
      type: object
    OutlineEntryKind:
      description: Structural element types an outline can point to.
      oneOf:
      - const: heading
        description: A document heading.
        type: string
      - const: table
        description: A table.
        type: string
      - const: figure
        description: A figure or image.
        type: string
      - const: page
        description: A document page.
        type: string
      - const: sheet
        description: A spreadsheet sheet.
        type: string
    PageCoverage:
      additionalProperties: false
      description: |-
        Page by page coverage of a source converted in page windows (a PDF; an image is one page).
        Formats docling converts whole (Office, HTML) have no coverage.

        The three lists are ascending, disjoint, and together cover exactly `1..=page_count`;
        `check` enforces it.
      properties:
        converted:
          description: Pages converted with no known loss.
          items:
            $ref: '#/components/schemas/PageRange'
          type: array
        not_converted:
          description: Pages with no extraction; a retry converts exactly these.
          items:
            $ref: '#/components/schemas/PageRange'
          type: array
        page_count:
          description: Pages in the original.
          format: uint32
          minimum: 1
          type: integer
        partly_extracted:
          description: Pages converted whose text is partly undecodable (`ExtractionWarning::UndecodableGlyphs`).
          items:
            $ref: '#/components/schemas/PageRange'
          type: array
      required:
      - page_count
      - converted
      - partly_extracted
      - not_converted
      type: object
    PageGlyphs:
      additionalProperties: false
      description: Undecodable glyphs on one page.
      properties:
        glyphs:
          description: Placeholders the library printed on that page.
          format: uint32
          minimum: 0
          type: integer
        page_no:
          description: One-based page.
          format: uint32
          minimum: 1
          type: integer
      required:
      - page_no
      - glyphs
      type: object
    PageRange:
      additionalProperties: false
      description: A one-based inclusive document page range.
      properties:
        end:
          description: Last page.
          format: uint32
          minimum: 1
          type: integer
        start:
          description: First page.
          format: uint32
          minimum: 1
          type: integer
      required:
      - start
      - end
      type: object
    PageRegion:
      additionalProperties: false
      description: A box on one page, slide or image of the original.
      properties:
        bbox:
          $ref: '#/components/schemas/BoundingBox'
          description: The box.
        page_no:
          description: One-based page or slide number.
          format: uint32
          minimum: 1
          type: integer
        page_size:
          $ref: '#/components/schemas/PageSize'
          description: The page's extent, so the box can be drawn over a page image on its own.
      required:
      - page_no
      - bbox
      - page_size
      type: object
    PageRequest:
      additionalProperties: false
      description: A bounded page request; the cursor is opaque and scoped to the query.
      properties:
        cursor:
          description: Opaque continuation cursor.
          type:
          - string
          - 'null'
        limit:
          description: Maximum results requested; server may return fewer.
          format: uint16
          maximum: 200
          minimum: 1
          type: integer
      required:
      - limit
      type: object
    PageSize:
      additionalProperties: false
      description: |-
        Extent of the page the box lies on, in the box's own unit (PDF points, image pixels, PPTX
        EMU). A reader draws the box over a page image by the ratio of the two, so it needs no unit.
      properties:
        height:
          description: Page height.
          format: double
          type: number
        width:
          description: Page width.
          format: double
          type: number
      required:
      - width
      - height
      type: object
    Permission:
      description: Application capabilities checked on every operation.
      oneOf:
      - const: read
        description: Read authorized workspace data.
        type: string
      - const: write
        description: Edit authorized workspace content.
        type: string
      - const: propose
        description: Create or update proposals without merging.
        type: string
      - const: approve
        description: Accept proposals at exact preconditions.
        type: string
      - const: review
        description: Record an explicit content review.
        type: string
      - const: admin
        description: Manage deployment or workspace access.
        type: string
    PresentRequest:
      additionalProperties: false
      description: |-
        Render a candidate from already resolved bindings without saving or approving it.

        Every binding must name `workspace_id`. Dispatch refuses a view for which
        `view.bindings_outside(workspace_id)` is not empty as `invalid_input`, before authorization
        and before the handler runs, whatever the caller may read: reading another workspace is not
        permission to republish its data here. `workspace_id` is the only authorization target.
      properties:
        view:
          $ref: '#/components/schemas/ViewDocument'
          description: Candidate visual composition.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - view
      type: object
    PresentResponse:
      additionalProperties: false
      description: |-
        A candidate presentation and the exact sources available to its UI.

        A View-level fault (schema, a binding outside the workspace) refuses the whole request; a
        chart-level fault never does and is reported in `charts`.
      properties:
        as_of:
          $ref: '#/components/schemas/Timestamp'
          description: When the bindings were resolved; for a pinned View, when the pinned inputs were read.
        charts:
          description: Exactly one per entry of `view.chart_refs()`, in that order.
          items:
            $ref: '#/components/schemas/ChartResult'
          type: array
        receipt_id:
          $ref: '#/components/schemas/ReceiptId'
          description: Tool response record.
        resolved_bindings:
          description: |-
            Exact data supplied for this render; each binding's `source.revision` is the resolved
            revision.
          items:
            $ref: '#/components/schemas/ViewBinding'
          type: array
        view:
          $ref: '#/components/schemas/ViewDocument'
          description: Validated presentation.
        warnings:
          description: Limits or freshness information.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - view
      - resolved_bindings
      - charts
      - as_of
      - warnings
      - receipt_id
      type: object
    PreviewNamesRequest:
      additionalProperties: false
      description: Calculate a rename plan with no persistent mutation.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_ids:
          description: Selected items.
          items:
            $ref: '#/components/schemas/ItemId'
          type: array
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Candidate rules, not necessarily saved.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - item_ids
      - rules
      type: object
    Principal:
      additionalProperties: false
      description: |-
        Server-established identity; never accepted from a request body.

        Identity is not authorization: effective permissions come from the access-control adapter
        as workspace and tenant grants, intersected with any delegation ceiling.
      properties:
        client_id:
          description: OAuth client when delegation is present.
          type:
          - string
          - 'null'
        delegation:
          anyOf:
          - $ref: '#/components/schemas/DelegationCeiling'
          - type: 'null'
          description: Ceiling applied to delegated routes.
        route:
          $ref: '#/components/schemas/AccessRoute'
          description: Verified authentication route.
        subject:
          description: Validated identity-provider subject.
          type: string
        tenant_id:
          $ref: '#/components/schemas/TenantId'
          description: Tenant boundary every storage scope for this principal carries.
      required:
      - subject
      - tenant_id
      - route
      type: object
    Proposal:
      additionalProperties: false
      description: A revision-bound proposed change set.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Base on which the proposal was drafted.
        changes:
          description: Proposed mutations.
          items:
            $ref: '#/components/schemas/Change'
          type: array
        client_id:
          description: OAuth or connector client it came through, recorded by the server.
          type:
          - string
          - 'null'
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Server-computed digest of the exact displayed change set.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        created_by:
          description: Server-recorded principal.
          type: string
        created_via:
          $ref: '#/components/schemas/AccessRoute'
          description: Route the proposal came by, recorded by the server.
        description:
          description: Rationale and limitations.
          type: string
        id:
          $ref: '#/components/schemas/ProposalId'
          description: Proposal identity.
        kind:
          $ref: '#/components/schemas/ProposalKind'
          description: What the proposal does, derived from `changes` by the server.
        proposal_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact proposed content.
        status:
          $ref: '#/components/schemas/ProposalStatus'
          description: Current suggestion state.
        title:
          description: Human-readable reason.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - base_revision
      - proposal_revision
      - content_digest
      - title
      - description
      - changes
      - kind
      - status
      - created_by
      - created_via
      - created_at
      type: object
    ProposalId:
      description: Identity of a suggested change set, not a review.
      format: uuid
      type: string
    ProposalKind:
      description: What a proposal does; derived from its changes, never chosen by the proposer.
      oneOf:
      - const: content
        description: 'Content changes: create, edit, move, archive.'
        type: string
      - const: supply_extraction
        description: Agent-supplied extraction text.
        type: string
    ProposalStatus:
      description: Lifecycle of a suggestion, not approval of a fact in it.
      oneOf:
      - const: open
        description: Available for review.
        type: string
      - const: accepted
        description: Merged by an authorized action.
        type: string
      - const: declined
        description: Closed without applying changes.
        type: string
      - const: conflict
        description: Base state changed; reconciliation required.
        type: string
    Purge:
      additionalProperties: false
      description: A durable, tenant-level purge record; it holds no content of the target.
      properties:
        completed_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When it completed.
        error:
          anyOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
          description: Last failure.
        id:
          $ref: '#/components/schemas/PurgeId'
          description: Identity.
        job_id:
          $ref: '#/components/schemas/JobId'
          description: The tenant job doing the work.
        report:
          anyOf:
          - $ref: '#/components/schemas/PurgeReport'
          - type: 'null'
          description: Present exactly when completed.
        requested_at:
          $ref: '#/components/schemas/Timestamp'
          description: When it was accepted.
        requested_by:
          description: Administrator subject.
          type: string
        state:
          $ref: '#/components/schemas/PurgeState'
          description: Progress.
        target:
          $ref: '#/components/schemas/PurgeTarget'
          description: What is removed.
      required:
      - id
      - target
      - state
      - job_id
      - requested_by
      - requested_at
      type: object
    PurgeId:
      description: Identity of one purge; its record outlives what it removed.
      format: uuid
      type: string
    PurgeItemRequest:
      additionalProperties: false
      description: Permanently remove one item, its history and its derivatives.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this purge is based; a moved head conflicts.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Item to remove.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace of the item.
      required:
      - workspace_id
      - item_id
      - base_revision
      - idempotency_key
      type: object
    PurgeReport:
      additionalProperties: false
      description: What a completed purge did; counts only.
      properties:
        backups_removed:
          description: Managed backups deleted (workspace archives, and their copies in pre-migration backups).
          format: uint32
          minimum: 0
          type: integer
        backups_rewritten:
          description: Managed backups rewritten without the target.
          format: uint32
          minimum: 0
          type: integer
        citations_invalidated:
          description: Stored citations (reviews, receipts, comments, View bindings) of the target invalidated.
          format: uint32
          minimum: 0
          type: integer
        citations_remapped:
          description: Stored citations of other items remapped to a rewritten revision.
          format: uint32
          minimum: 0
          type: integer
        drafts_removed:
          description: Drafts deleted.
          format: uint32
          minimum: 0
          type: integer
        exports_removed:
          description: Retained export and View export artifacts deleted.
          format: uint32
          minimum: 0
          type: integer
        objects_kept_shared:
          description: Objects kept because a surviving item still references them, as a decimal string.
          type: string
        objects_removed:
          description: Stored objects deleted, as a decimal string.
          type: string
        proposals_removed:
          description: Proposals deleted with their candidate references and comments.
          format: uint32
          minimum: 0
          type: integer
        revisions_invalidated:
          description: Revisions that no longer exist or were rewritten.
          format: uint32
          minimum: 0
          type: integer
        views_invalidated:
          description: Saved Views with an invalidated binding.
          format: uint32
          minimum: 0
          type: integer
      required:
      - objects_removed
      - objects_kept_shared
      - backups_removed
      - backups_rewritten
      - exports_removed
      - proposals_removed
      - drafts_removed
      - revisions_invalidated
      - citations_remapped
      - citations_invalidated
      - views_invalidated
      type: object
    PurgeState:
      description: Progress of a purge.
      oneOf:
      - const: requested
        description: Accepted; nothing removed yet.
        type: string
      - const: running
        description: Removing.
        type: string
      - const: completed
        description: Every application-managed copy is removed or rewritten; no affected backup is restorable.
        type: string
      - const: failed
        description: Stopped; repeating the request resumes it.
        type: string
    PurgeTarget:
      description: What a purge removes; identities only, never a name or a path.
      oneOf:
      - additionalProperties: false
        description: A whole workspace.
        properties:
          kind:
            const: workspace
            type: string
          workspace_id:
            $ref: '#/components/schemas/WorkspaceId'
            description: Removed workspace.
        required:
        - kind
        - workspace_id
        type: object
      - additionalProperties: false
        description: One item.
        properties:
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Removed item.
          kind:
            const: item
            type: string
          workspace_id:
            $ref: '#/components/schemas/WorkspaceId'
            description: Its workspace.
        required:
        - kind
        - workspace_id
        - item_id
        type: object
    PurgeWorkspaceRequest:
      additionalProperties: false
      description: Permanently remove a workspace.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this purge is based; a moved head conflicts.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace to remove.
      required:
      - workspace_id
      - base_revision
      - idempotency_key
      type: object
    ReadItemRequest:
      additionalProperties: false
      description: Read an item using an explicit representation and a single revision resolution.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        cursor:
          description: Opaque continuation tied to revision and representation.
          type:
          - string
          - 'null'
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        max_bytes:
          description: Response text budget; partial reads are marked and have continuation.
          format: uint32
          maximum: 1048576
          minimum: 256
          type: integer
        max_images:
          description: Maximum selected images.
          format: uint16
          maximum: 16
          minimum: 0
          type: integer
        selection:
          $ref: '#/components/schemas/Selection'
          description: Section, range, or full source.
        view:
          $ref: '#/components/schemas/ReadView'
          description: Requested representation.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - view
      - selection
      - max_bytes
      - max_images
      type: object
    ReadItemResponse:
      additionalProperties: false
      description: What the tool actually returned, not a claim about the host model context.
      properties:
        extraction:
          anyOf:
          - $ref: '#/components/schemas/ExtractionSummary'
          - type: 'null'
          description: 'For a source: whether its text is partial, supplied by an agent or corrected.'
        markdown:
          description: Text within the declared budget.
          type: string
        media:
          description: Selected images or original-file references.
          items:
            $ref: '#/components/schemas/MediaReference'
          type: array
        next_cursor:
          description: Resume this exact resolved read.
          type:
          - string
          - 'null'
        outline:
          description: Structural navigation.
          items:
            $ref: '#/components/schemas/OutlineEntry'
          type: array
        receipt_id:
          $ref: '#/components/schemas/ReceiptId'
          description: Durable record of returned content.
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Exact source resolution.
        truncated:
          description: True only when the response is partial.
          type: boolean
        view:
          $ref: '#/components/schemas/ReadView'
          description: Representation returned.
        warnings:
          description: Extraction or selection warnings.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - source
      - view
      - markdown
      - outline
      - media
      - warnings
      - truncated
      - receipt_id
      type: object
    ReadView:
      description: Select a representation rather than silently truncating a source.
      oneOf:
      - const: outline
        description: Headings, pages, and media descriptions.
        type: string
      - const: text
        description: Structured Markdown and source locators.
        type: string
      - const: multimodal
        description: Markdown and selected images.
        type: string
      - const: pages
        description: Selected rendered page images.
        type: string
      - const: original
        description: Authorized access to original bytes.
        type: string
    ReadinessRequest:
      additionalProperties: false
      description: Read configured dependency availability.
      type: object
    ReadinessResponse:
      additionalProperties: false
      description: Readiness summary, distinct from acceptance results.
      properties:
        dependencies:
          description: Individual dependency checks.
          items:
            $ref: '#/components/schemas/DependencyStatus'
          type: array
        ready:
          description: All configured mandatory dependencies are ready.
          type: boolean
        sandbox_origin:
          anyOf:
          - $ref: '#/components/schemas/SandboxOriginConfig'
          - type: 'null'
          description: Configured sandboxed HTML/artifact origin when isolation is enabled.
      required:
      - ready
      - dependencies
      type: object
    RebuildIndexRequest:
      additionalProperties: false
      description: Rebuild derived search and link indexes without deleting application records.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - idempotency_key
      type: object
    Receipt:
      additionalProperties: false
      description: What this application returned, not what an external model retained.
      properties:
        audience:
          $ref: '#/components/schemas/ReceiptAudience'
          description: Agent context or human display; these are distinct.
        id:
          $ref: '#/components/schemas/ReceiptId'
          description: Durable operation record.
        invalidated_by:
          anyOf:
          - $ref: '#/components/schemas/PurgeId'
          - type: 'null'
          description: The purge that invalidated a source this receipt cites; its stored path was scrubbed.
        operation_id:
          $ref: '#/components/schemas/OperationName'
          description: Canonical operation identifier.
        principal_subject:
          description: Authenticated acting principal.
          type: string
        returned_at:
          $ref: '#/components/schemas/Timestamp'
          description: Response time.
        route:
          $ref: '#/components/schemas/AccessRoute'
          description: Interface route.
        sources:
          description: Exact returned source selections.
          items:
            $ref: '#/components/schemas/SourceReference'
          type: array
        trace_id:
          description: Optional diagnostic trace reference.
          type:
          - string
          - 'null'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - operation_id
      - principal_subject
      - route
      - sources
      - returned_at
      - audience
      type: object
    ReceiptAudience:
      description: Where returned content went; the two are distinct evidence.
      oneOf:
      - const: agent_context
        description: Supplied to an agent's context through a tool result.
        type: string
      - const: human_display
        description: Shown to a person in the workspace.
        type: string
    ReceiptId:
      description: Identity of a durable application operation record.
      format: uuid
      type: string
    RedigestRequest:
      additionalProperties: false
      description: Reconvert an original with explicitly selected settings, preserving human corrections.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        settings:
          $ref: '#/components/schemas/ConversionSettings'
          description: |-
            Converter settings; they are part of the new digest's identity. With
            `unconverted_only` they must equal the current digest's settings, or the request is
            `invalid_input` on `/settings`.
        unconverted_only:
          description: |-
            Convert exactly the `not_converted` pages of the current extraction and merge them into
            a new digest, instead of converting the whole source again.
          type: boolean
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - settings
      - unconverted_only
      - idempotency_key
      type: object
    RenameEntry:
      additionalProperties: false
      description: A proposed path change with an explanation.
      properties:
        from:
          $ref: '#/components/schemas/WorkspacePath'
          description: Current path.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        to:
          $ref: '#/components/schemas/WorkspacePath'
          description: Proposed path.
        warnings:
          description: Ambiguity or collision details.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - item_id
      - from
      - to
      - warnings
      type: object
    RenamePlan:
      additionalProperties: false
      description: A preview bound to source state and exact conventions.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Workspace revision inspected.
        duplicate_observations:
          description: Duplicate path observations recorded during preview.
          items:
            $ref: '#/components/schemas/DuplicateObservation'
          type: array
        entries:
          description: Proposed changes.
          items:
            $ref: '#/components/schemas/RenameEntry'
          type: array
        rules_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest of the exact canonical rules.
        warnings:
          description: Plan-level warnings.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - base_revision
      - rules_digest
      - entries
      - duplicate_observations
      - warnings
      type: object
    RenderGrammar:
      description: Supported declarative presentation formats.
      oneOf:
      - const: vega_lite
        description: Charts over application-resolved named datasets.
        type: string
      - const: json_render
        description: Compositions of the approved component catalog.
        type: string
    ResolveViewRequest:
      additionalProperties: false
      description: Resolve and materialize a View without silently changing its saved specification.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        refresh_live:
          description: Only live views may request current input resolution.
          type: boolean
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - refresh_live
      type: object
    ResourceMetadata:
      additionalProperties: false
      description: OAuth protected-resource metadata for external MCP clients.
      properties:
        authorization_servers:
          description: Configured WorkOS issuer.
          items:
            type: string
          type: array
        bearer_methods_supported:
          description: Bearer methods accepted by the protected resource.
          items:
            type: string
          type: array
        resource:
          description: Canonical externally reachable MCP resource URI.
          type: string
        scopes_supported:
          description: Scopes actually configured; not invented permissions.
          items:
            type: string
          type: array
      required:
      - resource
      - authorization_servers
      - scopes_supported
      - bearer_methods_supported
      type: object
    RestoreReport:
      additionalProperties: false
      description: What a restore did.
      properties:
        drafts_restored:
          description: Drafts given back to their editors.
          format: uint32
          minimum: 0
          type: integer
        drafts_unassigned:
          description: Drafts whose editor is not a validated identity here; kept in the archive.
          format: uint32
          minimum: 0
          type: integer
        items:
          description: Items restored.
          format: uint32
          minimum: 0
          type: integer
      required:
      - items
      - drafts_restored
      - drafts_unassigned
      type: object
    RestoreRequest:
      additionalProperties: false
      description: Restore the selected state as a new commit without rewriting history.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Restore only this item when supplied.
        message:
          description: Reason for the restore.
          type: string
        target:
          $ref: '#/components/schemas/Revision'
          description: Historical state to restore.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - target
      - message
      - idempotency_key
      type: object
    RestoreWorkspaceRequest:
      additionalProperties: false
      description: |-
        Fill a blank workspace of this installation from an uploaded workspace archive.

        The restore keeps item ids, rewrites View bindings to this workspace, gives each draft
        whose editor is a validated subject with `write` here back to that editor, and keeps the
        others in the archive, unassigned and counted. An archive of this tenant whose workspace
        still exists, or has a purge record, is refused: purged content never comes back through
        an import. The upload is consumed when the restore completes.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        sha256:
          $ref: '#/components/schemas/Digest'
          description: SHA-256 the archive must have; checked before anything is written.
        upload_id:
          $ref: '#/components/schemas/UploadId'
          description: Completed upload of the archive into this workspace.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Blank target workspace.
      required:
      - workspace_id
      - upload_id
      - sha256
      - idempotency_key
      type: object
    RetryJobRequest:
      additionalProperties: false
      description: Retry a recoverable job with the same durable work identity.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity of this retry request, distinct from the job's durable identity.
        job_id:
          $ref: '#/components/schemas/JobId'
          description: Existing failed job.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - job_id
      - idempotency_key
      type: object
    Review:
      additionalProperties: false
      description: A review action linked to the content that was actually displayed.
      properties:
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest of the exact reviewed text.
        coverage:
          $ref: '#/components/schemas/ReviewCoverage'
          description: Coverage relative to current content.
        id:
          $ref: '#/components/schemas/ReviewId'
          description: Durable review identity.
        reviewed_at:
          $ref: '#/components/schemas/Timestamp'
          description: Action time.
        reviewer_subject:
          description: Server-established subject; not supplied in request.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Reviewed revision and range.
      required:
      - id
      - source
      - content_digest
      - reviewer_subject
      - reviewed_at
      - coverage
      type: object
    ReviewCoverage:
      description: How recorded review evidence relates to current content.
      oneOf:
      - const: current
        description: The recorded content digest still matches.
        type: string
      - const: changed
        description: Content changed after this review.
        type: string
      - const: imported
        description: Imported metadata has no authenticated in-app review event.
        type: string
      - const: unreviewed
        description: No covering review exists.
        type: string
      - const: invalidated
        description: The reviewed content was purged; the review covers nothing that still exists.
        type: string
    ReviewId:
      description: Identity of an explicit revision-bound review action.
      format: uuid
      type: string
    Revision:
      pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
      type: string
    RevokeConnectorRequest:
      additionalProperties: false
      description: Revoke one connector credential immediately.
      properties:
        connector_id:
          $ref: '#/components/schemas/ConnectorId'
          description: Connector to revoke.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
      required:
      - connector_id
      - idempotency_key
      type: object
    SandboxCapability:
      additionalProperties: false
      description: A capability URL on the sandbox origin; the token is the only credential and is never logged.
      properties:
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Expiry after which the capability resolves nothing.
        url:
          description: Absolute `/sandbox/{capability}` URL on the configured sandbox origin.
          type: string
      required:
      - url
      - expires_at
      type: object
    SandboxOriginConfig:
      additionalProperties: false
      description: |-
        Configured separate origin used to serve sandboxed HTML and hostile artifacts.

        Transport note: the server lane binds a sandbox-origin route that never attaches
        ambient session cookies or privileged APIs; the workspace-ui iframe loads this
        origin under sandbox constraints (SPEC sections 7 and 11).
      properties:
        origin:
          description: Absolute origin (scheme + host + optional port), never the application origin.
          type: string
      required:
      - origin
      type: object
    SaveDraftRequest:
      additionalProperties: false
      description: |-
        Save the caller's draft; always succeeds even when the head has moved.

        The first save takes the item's head revision as its base. Later saves keep the draft's
        base unless `base_revision` equals the current head, which is the explicit rebase.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Revision the editor saw; equal to the current head to rebase after resolving a conflict.
        body:
          description: Drafted Markdown body.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        properties:
          additionalProperties: true
          description: Complete preserved property map.
          type: object
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - body
      - properties
      - idempotency_key
      type: object
    SearchHit:
      additionalProperties: false
      description: A bounded excerpt linked to its exact source.
      properties:
        extraction:
          anyOf:
          - $ref: '#/components/schemas/ExtractionSummary'
          - type: 'null'
          description: 'For a source: whether its text is partial, supplied by an agent or corrected.'
        score:
          description: Ranking signal, never a truth or trust score.
          format: double
          type: number
        snippet:
          description: Matching text.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Reopenable citation.
        title:
          description: Item title.
          type: string
      required:
      - source
      - title
      - snippet
      - score
      type: object
    SearchRequest:
      additionalProperties: false
      description: |-
        Search the workspace at one revision with explicit scope and pagination.

        `query` may be empty (or only whitespace) only when `extraction` is set: then every
        matching source under `folder` is a hit, ordered by path, with its description as snippet
        (`check_rules`).
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        extraction:
          anyOf:
          - $ref: '#/components/schemas/ExtractionFilter'
          - type: 'null'
          description: Only sources that match; with an empty query, every such source is a hit.
        folder:
          description: Limit to a relative folder.
          type:
          - string
          - 'null'
        include_archived:
          description: Include archived items; deprecated items are always searchable.
          type: boolean
        page:
          $ref: '#/components/schemas/PageRequest'
          description: Bounded pagination with an opaque cursor.
        query:
          description: Search expression; not executable SQL.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - query
      - include_archived
      - page
      type: object
    SearchResponse:
      additionalProperties: false
      description: A paged authorized search result.
      properties:
        hits:
          description: Matching excerpts.
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
        next_cursor:
          description: Continuation cursor.
          type:
          - string
          - 'null'
        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved revision.
      required:
      - revision
      - hits
      type: object
    Selection:
      description: |-
        Explicit bounded source selection.

        `PartialEq` only: a `region` holds coordinates as `f64`.
      oneOf:
      - additionalProperties: false
        description: The complete source, subject to a visible response budget.
        properties:
          kind:
            const: all
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Inclusive line range.
        properties:
          kind:
            const: lines
            type: string
          range:
            $ref: '#/components/schemas/TextRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: Inclusive page range.
        properties:
          kind:
            const: pages
            type: string
          range:
            $ref: '#/components/schemas/PageRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: Rectangular sheet range.
        properties:
          kind:
            const: cells
            type: string
          range:
            $ref: '#/components/schemas/CellRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: An unambiguous heading identifier.
        properties:
          heading:
            description: Heading.
            type: string
          kind:
            const: section
            type: string
        required:
        - kind
        - heading
        type: object
      - additionalProperties: false
        description: |-
          A box on one page: the extracted items whose location lies inside it; the `pages` view
          returns that page's image.
        properties:
          kind:
            const: region
            type: string
          region:
            $ref: '#/components/schemas/PageRegion'
            description: Region.
        required:
        - kind
        - region
        type: object
    SessionResponse:
      additionalProperties: false
      description: Current identity and capability summary without credentials.
      properties:
        csrf_required:
          description: Browser writes require a same-origin anti-CSRF token.
          type: boolean
        principal:
          $ref: '#/components/schemas/Principal'
          description: Authenticated caller.
      required:
      - principal
      - csrf_required
      type: object
    SetLifecycleRequest:
      additionalProperties: false
      description: |-
        Change an item's status word or archive flag without claiming a business decision.

        At least one of `status` and `archived` is present, and `status` is never `other`
        (`check_rules`).
      properties:
        archived:
          description: Archive (`true`) or unarchive (`false`); absent leaves it unchanged.
          type:
          - boolean
          - 'null'
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        status:
          anyOf:
          - $ref: '#/components/schemas/ItemStatus'
          - type: 'null'
          description: New OKF status word; absent leaves it unchanged.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - idempotency_key
      type: object
    SetRulesRequest:
      additionalProperties: false
      description: Persist naming conventions as a versioned workspace file.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Validated rules.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - rules
      - idempotency_key
      type: object
    SetTypeRequest:
      additionalProperties: false
      description: Save a type definition without discarding existing extension properties.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        definition:
          $ref: '#/components/schemas/TypeDefinition'
          description: Validated property schema and UI hints.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - definition
      - idempotency_key
      type: object
    SourceAppearance:
      additionalProperties: false
      description: One source occurrence; identical bytes do not imply identical meaning.
      properties:
        extraction:
          $ref: '#/components/schemas/Extraction'
          description: Everything recorded about turning these bytes into text, converter identity included.
        media_type:
          description: Sniffed MIME type.
          type: string
        metadata:
          additionalProperties: true
          description: Extracted metadata with original field names preserved.
          type: object
        names:
          description: Observed aliases associated with this occurrence.
          items:
            $ref: '#/components/schemas/SourceName'
          type: array
        object:
          $ref: '#/components/schemas/Digest'
          description: Immutable object content hash.
        parent_item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Container or message parent.
        size:
          description: Decimal byte count.
          type: string
        supersedes:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Explicit successor relationship; not inferred from arrival time.
      required:
      - object
      - names
      - media_type
      - size
      - metadata
      - extraction
      type: object
    SourceLocation:
      description: |-
        A location and how it was obtained; an inferred location is a different variant from a
        direct one, so no consumer can show it as direct by accident.
      oneOf:
      - additionalProperties: false
        description: From the converter's own provenance.
        properties:
          locator:
            $ref: '#/components/schemas/SourceLocator'
            description: Where.
          provenance:
            const: direct
            type: string
        required:
        - provenance
        - locator
        type: object
      - additionalProperties: false
        description: Found by matching text against the page text layer (ingest-locates-unlocated-items).
        properties:
          locator:
            $ref: '#/components/schemas/SourceLocator'
            description: Where.
          provenance:
            const: inferred
            type: string
        required:
        - provenance
        - locator
        type: object
      - additionalProperties: false
        description: Not known; never given a guessed box.
        properties:
          provenance:
            const: unresolved
            type: string
          reason:
            $ref: '#/components/schemas/UnresolvedReason'
            description: Why.
        required:
        - provenance
        - reason
        type: object
    SourceLocator:
      description: Where in the original bytes something is.
      oneOf:
      - additionalProperties: false
        description: A whole page or slide.
        properties:
          kind:
            const: page
            type: string
          page_no:
            description: One-based page or slide number.
            format: uint32
            minimum: 1
            type: integer
        required:
        - kind
        - page_no
        type: object
      - additionalProperties: false
        description: A box on a page, slide or image.
        properties:
          kind:
            const: region
            type: string
          region:
            $ref: '#/components/schemas/PageRegion'
            description: The box.
        required:
        - kind
        - region
        type: object
      - additionalProperties: false
        description: Spreadsheet cells.
        properties:
          kind:
            const: cells
            type: string
          range:
            $ref: '#/components/schemas/CellRange'
            description: Sheet and one-based inclusive cell range.
        required:
        - kind
        - range
        type: object
    SourceName:
      additionalProperties: false
      description: An observed source name and location; not an authority assertion.
      properties:
        filename:
          description: Original supplied filename.
          type: string
        folder:
          description: Original relative location.
          type: string
        observed_at:
          $ref: '#/components/schemas/Timestamp'
          description: Observation time.
        supplied_by:
          description: Server-recorded source identity.
          type: string
      required:
      - filename
      - folder
      - observed_at
      - supplied_by
      type: object
    SourceReference:
      additionalProperties: false
      description: A precise citation that can be reopened independently of current state.
      properties:
        digest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Exact derived artifact hash.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        locations:
          description: |-
            Where the cited selection of the digest lies in the original, one entry per located
            item it covers, in reading order.

            The server computes it from (item, revision, digest, selection). A response always
            fills it. In a request an omitted list means "fill it"; a present list must equal what
            the server computes, or the request is `invalid_input` on `.../locations`, so a caller
            never supplies a location. A saved View file does not keep locations: they are derived,
            and the server fills them when it returns the View.
          items:
            $ref: '#/components/schemas/SourceLocation'
          type: array
        path:
          $ref: '#/components/schemas/WorkspacePath'
          description: Relative path at the resolved source revision.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved source revision.
        selection:
          $ref: '#/components/schemas/Selection'
          description: Resolved page, lines, cells, region, section, or entire source.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - path
      - revision
      - selection
      type: object
    StartImportRequest:
      additionalProperties: false
      description: Convert finalized uploads into source cards in the user-selected folder.
      properties:
        apply_naming_rules:
          description: Apply the explicit workspace conventions after preview acceptance.
          type: boolean
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        destination:
          description: Relative destination folder; empty for root.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Durable retry identity.
        settings:
          anyOf:
          - $ref: '#/components/schemas/ConversionSettings'
          - type: 'null'
          description: |-
            Converter settings; absent means the deployment's defaults, resolved into the job at
            acceptance so a retry converts with the same settings.
        upload_ids:
          description: Completed upload slots.
          items:
            $ref: '#/components/schemas/UploadId'
          type: array
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - upload_ids
      - destination
      - idempotency_key
      - apply_naming_rules
      type: object
    SuppliedText:
      additionalProperties: false
      description: Accepted agent-supplied text of one source.
      properties:
        approved_at:
          $ref: '#/components/schemas/Timestamp'
          description: When it was accepted.
        approved_by:
          description: Subject who accepted the proposal.
          type: string
        client_id:
          description: OAuth or connector client it came through.
          type:
          - string
          - 'null'
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: SHA-256 of the supplied Markdown.
        kept_by:
          description: Who chose this text over a later complete conversion.
          type:
          - string
          - 'null'
        pages:
          description: 'Pages the agent says the text covers: a claim, never a location; empty for the whole.'
          items:
            $ref: '#/components/schemas/PageRange'
          type: array
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: The accepted proposal.
        supplied_by:
          description: Subject of the agent that proposed it, recorded by the server.
          type: string
      required:
      - proposal_id
      - supplied_by
      - approved_by
      - approved_at
      - content_digest
      - pages
      type: object
    TenantId:
      pattern: ^[A-Za-z0-9_-]{1,128}$
      type: string
    TextOrigin:
      description: Whose text a source card shows and search indexes.
      oneOf:
      - const: converter
        description: The converter's extraction.
        type: string
      - const: supplied_by_agent
        description: Text an agent proposed and a person accepted.
        type: string
      - const: none
        description: 'No text: pending, failed or unsupported, with nothing supplied.'
        type: string
    TextRange:
      additionalProperties: false
      description: A one-based inclusive line range.
      properties:
        end:
          description: Last line, at least start.
          format: uint32
          minimum: 1
          type: integer
        start:
          description: First line, starting at one.
          format: uint32
          minimum: 1
          type: integer
      required:
      - start
      - end
      type: object
    Timestamp:
      format: date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
      type: string
    TypeDefinition:
      additionalProperties: false
      description: A user-defined type schema and UI hints.
      properties:
        name:
          description: Exact user-facing OKF type name.
          type: string
        properties_schema:
          description: JSON Schema for type-specific properties.
        schema_version:
          description: Application format version.
          format: uint32
          minimum: 0
          type: integer
        ui_schema:
          description: Presentation hints; never authorization rules.
      required:
      - name
      - schema_version
      - properties_schema
      - ui_schema
      type: object
    UnarchiveWorkspaceRequest:
      additionalProperties: false
      description: Return an archived workspace to ordinary listings.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - idempotency_key
      type: object
    UnresolvedReason:
      description: Why a location is not known; one variant per reason the producing rule states.
      oneOf:
      - additionalProperties: false
        description: The format has no page geometry (DOCX, HTML, Markdown).
        properties:
          kind:
            const: format_has_no_locator
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: The converter gave this item no location and no rule locates it (PPTX, XLSX).
        properties:
          kind:
            const: not_located_by_converter
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: The page text layer could not be read.
        properties:
          kind:
            const: no_text_layer
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: 'A table or picture: there is no text to look up.'
        properties:
          kind:
            const: no_text_to_match
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Neither the parent nor an earlier sibling is located.
        properties:
          kind:
            const: no_page_to_search
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: No text-layer item on the searched pages has exactly this text.
        properties:
          kind:
            const: no_match
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Several text-layer items have exactly this text.
        properties:
          kind:
            const: ambiguous_match
            type: string
          occurrences:
            description: How many.
            format: uint32
            minimum: 0
            type: integer
        required:
        - kind
        - occurrences
        type: object
      - additionalProperties: false
        description: The one match has no area or lies outside the page.
        properties:
          kind:
            const: match_not_a_location
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: The cited text is a human correction, which has no place in the original.
        properties:
          kind:
            const: corrected_text
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: The cited text was supplied by an agent; its page claims are not locations.
        properties:
          kind:
            const: supplied_text
            type: string
        required:
        - kind
        type: object
    UpdateWorkspaceRequest:
      additionalProperties: false
      description: Update workspace presentation metadata at a known revision.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        description:
          description: Updated purpose.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        name:
          description: New display name.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - name
      - description
      - idempotency_key
      type: object
    Upload:
      additionalProperties: false
      description: An authenticated upload slot for a specific source occurrence.
      properties:
        complete:
          description: Whether expected bytes and digest have been verified.
          type: boolean
        id:
          $ref: '#/components/schemas/UploadId'
          description: Upload identity.
        received_bytes:
          description: Durably retained byte count.
          type: string
        upload_path:
          description: Same-origin binary PUT target.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - upload_path
      - received_bytes
      - complete
      type: object
    UploadId:
      description: Identity of one authenticated source upload occurrence.
      format: uuid
      type: string
    ViewBinding:
      additionalProperties: false
      description: |-
        A named source selection used by a chart or layout.

        A saved View binds only to sources in its own workspace: `source.workspace_id` must equal
        the workspace the View is saved or presented in (`ViewDocument::bindings_outside`).
      properties:
        materialized:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: |-
            Retained `Dataset` bytes for reproducibility; in a present or resolve result, absent
            for a binding whose dataset could not be produced.
        name:
          description: Dataset or component binding name.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Resolved cited input.
        transforms:
          description: Declared allowed data transformations; validated against the selected grammar.
          items: true
          type: array
        units:
          additionalProperties:
            type: string
          description: Column or field units.
          type: object
      required:
      - name
      - source
      - units
      - transforms
      type: object
    ViewDocument:
      additionalProperties: false
      description: An editable visual artifact with prose and explicit source bindings.
      properties:
        bindings:
          description: Cited input datasets and passages.
          items:
            $ref: '#/components/schemas/ViewBinding'
          type: array
        charts:
          additionalProperties: true
          description: Named Vega-Lite specs referenced by `json_render` Chart components; empty for `vega_lite`.
          type: object
        description:
          description: Readable explanation independent of the renderer.
          type: string
        grammar:
          $ref: '#/components/schemas/RenderGrammar'
          description: Declarative renderer grammar.
        mode:
          $ref: '#/components/schemas/ViewMode'
          description: Pinned or explicitly live.
        schema_version:
          description: App-owned format version, currently 1.
          format: uint32
          minimum: 0
          type: integer
        spec:
          description: Validated renderer specification with no arbitrary code or external fetching.
        title:
          description: Human-readable visual title.
          type: string
      required:
      - schema_version
      - title
      - description
      - mode
      - grammar
      - bindings
      - spec
      type: object
    ViewMode:
      description: Pinned historical views and explicit live refresh have different semantics.
      oneOf:
      - const: pinned
        description: All bindings reference retained immutable source revisions.
        type: string
      - const: live
        description: Bindings request current sources and disclose each resolved revision.
        type: string
    Warning:
      additionalProperties: false
      description: A diagnostic that does not silently discard usable input.
      properties:
        code:
          description: Stable diagnostic identifier.
          type: string
        location:
          description: Page, cell, path, or field locator.
          type:
          - string
          - 'null'
        message:
          description: Human-readable explanation.
          type: string
      required:
      - code
      - message
      type: object
    Workspace:
      additionalProperties: false
      description: A user-owned OKF workspace with a resolved head revision.
      properties:
        archived_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: When it was archived; absent while it is not archived.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        description:
          description: One-line context for people and agents.
          type: string
        head:
          $ref: '#/components/schemas/Revision'
          description: Current resolved Git commit.
        id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Stable application identity.
        name:
          description: Human-selected workspace name.
          type: string
        permissions:
          description: The caller's effective grant on this workspace after any delegation ceiling.
          items:
            $ref: '#/components/schemas/Permission'
          type: array
      required:
      - id
      - name
      - description
      - head
      - created_at
      - permissions
      type: object
    WorkspaceId:
      description: Stable application identity for one user-organized workspace.
      format: uuid
      type: string
    WorkspacePath:
      maxLength: 4096
      minLength: 1
      pattern: ^[^/\\:<>"|?*\x00-\x1f]+(/[^/\\:<>"|?*\x00-\x1f]+)*$
      type: string
  securitySchemes:
    bearerAuth:
      description: 'Hosted: a WorkOS Connect access token. Local: an opaque connector secret issued by create_connector.'
      scheme: bearer
      type: http
    browserSession:
      description: Local-owner or WorkOS browser session; cookie-authenticated writes also require the CSRF token.
      in: cookie
      name: okf-session
      type: apiKey
