            $ref: '#/components/schemas/ItemSummary'
          type: array
        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved revision.
        truncated:
          description: The graph is partial due to budget.
          type: boolean
      required:
      - revision
      - nodes
      - edges
      - truncated
      type: object
    GetItemRequest:
      additionalProperties: false
      description: Read the editable representation of an item at a selected revision.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
