        description: The `export_view` operation.
        type: string
      - const: get_catalog
        description: The `get_catalog` operation.
        type: string
      - const: get_receipt
        description: The `get_receipt` operation.
        type: string
      - const: list_events
        description: The `list_events` operation.
        type: string
      - const: get_session
        description: The `get_session` operation.
        type: string
      - const: create_connector
        description: The `create_connector` operation.
        type: string
      - const: list_connectors
        description: The `list_connectors` operation.
        type: string
      - const: revoke_connector
        description: The `revoke_connector` operation.
        type: string
      - const: get_health
        description: The `get_health` operation.
        type: string
      - const: get_readiness
        description: The `get_readiness` operation.
        type: string
    OutlineEntry:
      additionalProperties: false
      description: A navigable structural element from a document.
      properties:
        kind:
          $ref: '#/components/schemas/OutlineEntryKind'
          description: Structural element type.
        label:
          description: Visible heading or media caption.
          type: string
        level:
          description: Heading depth or zero for non-heading elements.
          format: uint16
          maximum: 65535
          minimum: 0
          type: integer
        selection:
          $ref: '#/components/schemas/Selection'
          description: Precise location to request next.
      required:
      - label
      - level
      - selection
      - kind
      type: object
    OutlineEntryKind:
      description: Structural element types an outline can point to.
      oneOf:
      - const: heading
        description: A document heading.
        type: string
      - const: table
        description: A table.
        type: string
      - const: figure
        description: A figure or image.
        type: string
      - const: page
        description: A document page.
        type: string
      - const: sheet
        description: A spreadsheet sheet.
        type: string
    PageRange:
      additionalProperties: false
      description: A one-based inclusive document page range.
      properties:
        end:
          description: Last page.
          format: uint32
          minimum: 1
          type: integer
        start:
          description: First page.
          format: uint32
          minimum: 1
          type: integer
      required:
      - start
      - end
      type: object
    PageRequest:
      additionalProperties: false
      description: A bounded page request; the cursor is opaque and scoped to the query.
      properties:
        cursor:
          description: Opaque continuation cursor.
          type:
          - string
          - 'null'
        limit:
          description: Maximum results requested; server may return fewer.
          format: uint16
          maximum: 200
          minimum: 1
          type: integer
      required:
      - limit
      type: object
    Permission:
      description: Application capabilities checked on every operation.
      oneOf:
      - const: read
        description: Read authorized workspace data.
        type: string
      - const: write
        description: Edit authorized workspace content.
        type: string
      - const: propose
        description: Create or update proposals without merging.
        type: string
      - const: approve
        description: Accept proposals at exact preconditions.
        type: string
      - const: review
        description: Record an explicit content review.
        type: string
      - const: admin
        description: Manage deployment or workspace access.
        type: string
    PresentRequest:
      additionalProperties: false
      description: |-
        Render a candidate from already resolved bindings without saving or approving it.

        Every binding must name `workspace_id`; the handler rejects a view for which
        `view.bindings_outside(workspace_id)` is not empty. Each binding's source workspace is
        still an authorization target, so a foreign binding is refused before the handler runs.
      properties:
        view:
          $ref: '#/components/schemas/ViewDocument'
          description: Candidate visual composition.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - view
      type: object
    PresentResponse:
      additionalProperties: false
      description: A candidate presentation and the exact sources available to its UI.
      properties:
        receipt_id:
          $ref: '#/components/schemas/ReceiptId'
          description: Tool response record.
        resolved_bindings:
          description: Exact data supplied for this render.
          items:
            $ref: '#/components/schemas/ViewBinding'
          type: array
        view:
          $ref: '#/components/schemas/ViewDocument'
          description: Validated presentation.
        warnings:
          description: Limits or freshness information.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - view
      - resolved_bindings
      - warnings
      - receipt_id
      type: object
    PreviewNamesRequest:
      additionalProperties: false
      description: Calculate a rename plan with no persistent mutation.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_ids:
          description: Selected items.
          items:
            $ref: '#/components/schemas/ItemId'
          type: array
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Candidate rules, not necessarily saved.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - item_ids
      - rules
      type: object
    Principal:
      additionalProperties: false
      description: |-
        Server-established identity; never accepted from a request body.

        Identity is not authorization: effective permissions come from the access-control adapter
        as workspace and tenant grants, intersected with any delegation ceiling.
      properties:
        client_id:
          description: OAuth client when delegation is present.
          type:
          - string
          - 'null'
        delegation:
          anyOf:
          - $ref: '#/components/schemas/DelegationCeiling'
          - type: 'null'
          description: Ceiling applied to delegated routes.
        route:
          $ref: '#/components/schemas/AccessRoute'
          description: Verified authentication route.
        subject:
          description: Validated identity-provider subject.
          type: string
        tenant_id:
          $ref: '#/components/schemas/TenantId'
          description: Tenant boundary every storage scope for this principal carries.
      required:
      - subject
      - tenant_id
      - route
      type: object
    Proposal:
      additionalProperties: false
      description: A revision-bound proposed change set.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Base on which the proposal was drafted.
        changes:
          description: Proposed mutations.
          items:
            $ref: '#/components/schemas/Change'
          type: array
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Server-computed digest of the exact displayed change set.
        created_at:
          description: RFC 3339 creation time.
          type: string
        created_by:
          description: Server-recorded principal.
          type: string
        description:
          description: Rationale and limitations.
          type: string
        id:
          $ref: '#/components/schemas/ProposalId'
          description: Proposal identity.
        proposal_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact proposed content.
        status:
          $ref: '#/components/schemas/ProposalStatus'
          description: Current suggestion state.
        title:
          description: Human-readable reason.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - base_revision
      - proposal_revision
      - content_digest
      - title
      - description
      - changes
      - status
      - created_by
      - created_at
      type: object
    ProposalId:
      description: Identity of a suggested change set, not a review.
      format: uuid
      type: string
    ProposalStatus:
      description: Lifecycle of a suggestion, not approval of a fact in it.
      oneOf:
      - const: open
        description: Available for review.
        type: string
      - const: accepted
        description: Merged by an authorized action.
        type: string
      - const: declined
        description: Closed without applying changes.
        type: string
      - const: conflict
        description: Base state changed; reconciliation required.
        type: string
    ReadItemRequest:
      additionalProperties: false
      description: Read an item using an explicit representation and a single revision resolution.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        cursor:
          description: Opaque continuation tied to revision and representation.
          type:
          - string
          - 'null'
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        max_bytes:
          description: Response text budget; partial reads are marked and have continuation.
          format: uint32
          maximum: 1048576
          minimum: 256
          type: integer
        max_images:
          description: Maximum selected images.
          format: uint16
          maximum: 16
          minimum: 0
          type: integer
        selection:
          $ref: '#/components/schemas/Selection'
          description: Section, range, or full source.
        view:
          $ref: '#/components/schemas/ReadView'
          description: Requested representation.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - view
      - selection
      - max_bytes
      - max_images
      type: object
    ReadItemResponse:
      additionalProperties: false
      description: What the tool actually returned, not a claim about the host model context.
      properties:
        markdown:
          description: Text within the declared budget.
          type: string
        media:
          description: Selected images or original-file references.
          items:
            $ref: '#/components/schemas/MediaReference'
          type: array
        next_cursor:
          description: Resume this exact resolved read.
          type:
          - string
          - 'null'
        outline:
          description: Structural navigation.
          items:
            $ref: '#/components/schemas/OutlineEntry'
          type: array
        receipt_id:
          $ref: '#/components/schemas/ReceiptId'
          description: Durable record of returned content.
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Exact source resolution.
        truncated:
          description: True only when the response is partial.
          type: boolean
        view:
          $ref: '#/components/schemas/ReadView'
          description: Representation returned.
        warnings:
          description: Extraction or selection warnings.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - source
      - view
      - markdown
      - outline
      - media
      - warnings
      - truncated
      - receipt_id
      type: object
    ReadView:
      description: Select a representation rather than silently truncating a source.
      oneOf:
      - const: outline
        description: Headings, pages, and media descriptions.
        type: string
      - const: text
        description: Structured Markdown and source locators.
        type: string
      - const: multimodal
        description: Markdown and selected images.
        type: string
      - const: pages
        description: Selected rendered page images.
        type: string
      - const: original
        description: Authorized access to original bytes.
        type: string
    ReadinessRequest:
      additionalProperties: false
      description: Read configured dependency availability.
      type: object
    ReadinessResponse:
      additionalProperties: false
      description: Readiness summary, distinct from acceptance results.
      properties:
        dependencies:
          description: Individual dependency checks.
          items:
            $ref: '#/components/schemas/DependencyStatus'
          type: array
        ready:
          description: All configured mandatory dependencies are ready.
          type: boolean
        sandbox_origin:
          anyOf:
          - $ref: '#/components/schemas/SandboxOriginConfig'
          - type: 'null'
          description: Configured sandboxed HTML/artifact origin when isolation is enabled.
      required:
      - ready
      - dependencies
      type: object
    RebuildIndexRequest:
      additionalProperties: false
      description: Rebuild derived search and link indexes without deleting application records.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - idempotency_key
      type: object
    Receipt:
      additionalProperties: false
      description: What this application returned, not what an external model retained.
      properties:
        audience:
          $ref: '#/components/schemas/ReceiptAudience'
          description: Agent context or human display; these are distinct.
        id:
          $ref: '#/components/schemas/ReceiptId'
          description: Durable operation record.
        operation_id:
          $ref: '#/components/schemas/OperationName'
          description: Canonical operation identifier.
        principal_subject:
          description: Authenticated acting principal.
          type: string
        returned_at:
          description: RFC 3339 response time.
          type: string
        route:
          $ref: '#/components/schemas/AccessRoute'
          description: Interface route.
        sources:
          description: Exact returned source selections.
          items:
            $ref: '#/components/schemas/SourceReference'
          type: array
        trace_id:
          description: Optional diagnostic trace reference.
          type:
          - string
          - 'null'
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - operation_id
      - principal_subject
      - route
      - sources
      - returned_at
      - audience
      type: object
    ReceiptAudience:
      description: Where returned content went; the two are distinct evidence.
      oneOf:
      - const: agent_context
        description: Supplied to an agent's context through a tool result.
        type: string
      - const: human_display
        description: Shown to a person in the workspace.
        type: string
    ReceiptId:
      description: Identity of a durable application operation record.
      format: uuid
      type: string
    RedigestRequest:
      additionalProperties: false
      description: Reconvert an original with explicitly selected settings, preserving human corrections.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        settings:
          additionalProperties: true
          description: Converter options that participate in the digest cache key.
          type: object
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - settings
      - idempotency_key
      type: object
    RenameEntry:
      additionalProperties: false
      description: A proposed path change with an explanation.
      properties:
        from:
          $ref: '#/components/schemas/WorkspacePath'
          description: Current path.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        to:
          $ref: '#/components/schemas/WorkspacePath'
          description: Proposed path.
        warnings:
          description: Ambiguity or collision details.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - item_id
      - from
      - to
      - warnings
      type: object
    RenamePlan:
      additionalProperties: false
      description: A preview bound to source state and exact conventions.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Workspace revision inspected.
        duplicate_observations:
          description: Duplicate path observations recorded during preview.
          items:
            $ref: '#/components/schemas/DuplicateObservation'
          type: array
        entries:
          description: Proposed changes.
          items:
            $ref: '#/components/schemas/RenameEntry'
          type: array
        rules_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest of the exact canonical rules.
        warnings:
          description: Plan-level warnings.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - base_revision
      - rules_digest
      - entries
      - duplicate_observations
      - warnings
      type: object
    RenderGrammar:
      description: Supported declarative presentation formats.
      oneOf:
      - const: vega_lite
        description: Charts over application-resolved named datasets.
        type: string
      - const: json_render
        description: Compositions of the approved component catalog.
        type: string
    ResolveViewRequest:
      additionalProperties: false
      description: Resolve and materialize a View without silently changing its saved specification.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        refresh_live:
          description: Only live views may request current input resolution.
          type: boolean
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - refresh_live
      type: object
    ResourceMetadata:
      additionalProperties: false
      description: OAuth protected-resource metadata for external MCP clients.
      properties:
        authorization_servers:
          description: Configured WorkOS issuer.
          items:
            type: string
          type: array
        bearer_methods_supported:
          description: Bearer methods accepted by the protected resource.
          items:
            type: string
          type: array
        resource:
          description: Canonical externally reachable MCP resource URI.
          type: string
        scopes_supported:
          description: Scopes actually configured; not invented permissions.
          items:
            type: string
          type: array
      required:
      - resource
      - authorization_servers
      - scopes_supported
      - bearer_methods_supported
      type: object
    RestoreRequest:
      additionalProperties: false
      description: Restore the selected state as a new commit without rewriting history.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Restore only this item when supplied.
        message:
          description: Reason for the restore.
          type: string
        target:
          $ref: '#/components/schemas/Revision'
          description: Historical state to restore.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - target
      - message
      - idempotency_key
      type: object
    RestoreWorkspaceRequest:
      additionalProperties: false
      description: Restore a workspace from a retained backup artifact (full restore of content and app records).
      properties:
        artifact_id:
          $ref: '#/components/schemas/ArtifactId'
          description: Retained backup artifact to restore from.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity for the restore job.
        sha256:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Optional integrity check against the artifact digest before restore begins.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - artifact_id
      - idempotency_key
      type: object
    RetryJobRequest:
      additionalProperties: false
      description: Retry a recoverable job with the same durable work identity.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity of this retry request, distinct from the job's durable identity.
        job_id:
          $ref: '#/components/schemas/JobId'
          description: Existing failed job.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - job_id
      - idempotency_key
      type: object
    Review:
      additionalProperties: false
      description: A review action linked to the content that was actually displayed.
      properties:
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest of the exact reviewed text.
        coverage:
          $ref: '#/components/schemas/ReviewCoverage'
          description: Coverage relative to current content.
        id:
          $ref: '#/components/schemas/ReviewId'
          description: Durable review identity.
        reviewed_at:
          description: RFC 3339 action time.
          type: string
        reviewer_subject:
          description: Server-established subject; not supplied in request.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Reviewed revision and range.
      required:
      - id
      - source
      - content_digest
      - reviewer_subject
      - reviewed_at
      - coverage
      type: object
    ReviewCoverage:
      description: How recorded review evidence relates to current content.
      oneOf:
      - const: current
        description: The recorded content digest still matches.
        type: string
      - const: changed
        description: Content changed after this review.
        type: string
      - const: imported
        description: Imported metadata has no authenticated in-app review event.
        type: string
      - const: unreviewed
        description: No covering review exists.
        type: string
    ReviewId:
      description: Identity of an explicit revision-bound review action.
      format: uuid
      type: string
    Revision:
      pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
      type: string
    RevokeConnectorRequest:
      additionalProperties: false
      description: Revoke one connector credential immediately.
      properties:
        connector_id:
          $ref: '#/components/schemas/ConnectorId'
          description: Connector to revoke.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
      required:
      - connector_id
      - idempotency_key
      type: object
    SandboxCapability:
      additionalProperties: false
      description: A capability URL on the sandbox origin; the token is the only credential and is never logged.
      properties:
        expires_at:
          description: RFC 3339 expiry after which the capability resolves nothing.
          type: string
        url:
          description: Absolute `/sandbox/{capability}` URL on the configured sandbox origin.
          type: string
      required:
      - url
      - expires_at
      type: object
    SandboxOriginConfig:
      additionalProperties: false
      description: |-
        Configured separate origin used to serve sandboxed HTML and hostile artifacts.

        Transport note: the server lane binds a sandbox-origin route that never attaches
        ambient session cookies or privileged APIs; the workspace-ui iframe loads this
        origin under sandbox constraints (SPEC sections 7 and 11).
      properties:
        origin:
          description: Absolute origin (scheme + host + optional port), never the application origin.
          type: string
      required:
      - origin
      type: object
    SaveDraftRequest:
      additionalProperties: false
      description: |-
        Save the caller's draft; always succeeds even when the head has moved.

        The first save takes the item's head revision as its base. Later saves keep the draft's
        base unless `base_revision` equals the current head, which is the explicit rebase.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Revision the editor saw; equal to the current head to rebase after resolving a conflict.
        body:
          description: Drafted Markdown body.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        properties:
          additionalProperties: true
          description: Complete preserved property map.
          type: object
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - body
      - properties
      - idempotency_key
      type: object
    SearchHit:
      additionalProperties: false
      description: A bounded excerpt linked to its exact source.
      properties:
        score:
          description: Ranking signal, never a truth or trust score.
          format: double
          type: number
        snippet:
          description: Matching text.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Reopenable citation.
        title:
          description: Item title.
          type: string
      required:
      - source
      - title
      - snippet
      - score
      type: object
    SearchRequest:
      additionalProperties: false
      description: Search the workspace at one revision with explicit scope and pagination.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        folder:
          description: Limit to a relative folder.
          type:
          - string
          - 'null'
        include_archived:
          description: Include historical lifecycle items.
          type: boolean
        page:
          $ref: '#/components/schemas/PageRequest'
          description: Bounded pagination with an opaque cursor.
        query:
          description: Search expression; not executable SQL.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - query
      - include_archived
      - page
      type: object
    SearchResponse:
      additionalProperties: false
      description: A paged authorized search result.
      properties:
        hits:
          description: Matching excerpts.
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
        next_cursor:
          description: Continuation cursor.
          type:
          - string
          - 'null'
        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved revision.
      required:
      - revision
      - hits
      type: object
    Selection:
      description: Explicit bounded source selection.
      oneOf:
      - additionalProperties: false
        description: The complete source, subject to a visible response budget.
        properties:
          kind:
            const: all
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Inclusive line range.
        properties:
          kind:
            const: lines
            type: string
          range:
            $ref: '#/components/schemas/TextRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: Inclusive page range.
        properties:
          kind:
            const: pages
            type: string
          range:
            $ref: '#/components/schemas/PageRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: Rectangular sheet range.
        properties:
          kind:
            const: cells
            type: string
          range:
            $ref: '#/components/schemas/CellRange'
            description: Range.
        required:
        - kind
        - range
        type: object
      - additionalProperties: false
        description: An unambiguous heading identifier.
        properties:
          heading:
            description: Heading.
            type: string
          kind:
            const: section
            type: string
        required:
        - kind
        - heading
        type: object
    SessionResponse:
      additionalProperties: false
      description: Current identity and capability summary without credentials.
      properties:
        csrf_required:
          description: Browser writes require a same-origin anti-CSRF token.
          type: boolean
        principal:
          $ref: '#/components/schemas/Principal'
          description: Authenticated caller.
      required:
      - principal
      - csrf_required
      type: object
    SetLifecycleRequest:
      additionalProperties: false
      description: Retire or reactivate an item without claiming a business decision.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
          description: Requested lifecycle.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - lifecycle
      - idempotency_key
      type: object
    SetRulesRequest:
      additionalProperties: false
      description: Persist naming conventions as a versioned workspace file.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Validated rules.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - rules
      - idempotency_key
      type: object
    SetTypeRequest:
      additionalProperties: false
      description: Save a type definition without discarding existing extension properties.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        definition:
          $ref: '#/components/schemas/TypeDefinition'
          description: Validated property schema and UI hints.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - definition
      - idempotency_key
      type: object
    SourceAppearance:
      additionalProperties: false
      description: One source occurrence; identical bytes do not imply identical meaning.
      properties:
        media_type:
          description: Sniffed MIME type.
          type: string
        metadata:
          additionalProperties: true
          description: Extracted metadata with original field names preserved.
          type: object
        names:
          description: Observed aliases associated with this occurrence.
          items:
            $ref: '#/components/schemas/SourceName'
          type: array
        object:
          $ref: '#/components/schemas/Digest'
          description: Immutable object content hash.
        parent_item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Container or message parent.
        size:
          description: Decimal byte count.
          type: string
        supersedes:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Explicit successor relationship; not inferred from arrival time.
      required:
      - object
      - names
      - media_type
      - size
      - metadata
      type: object
    SourceName:
      additionalProperties: false
      description: An observed source name and location; not an authority assertion.
      properties:
        filename:
          description: Original supplied filename.
          type: string
        folder:
          description: Original relative location.
          type: string
        observed_at:
          description: RFC 3339 observation time.
          type: string
        supplied_by:
          description: Server-recorded source identity.
          type: string
      required:
      - filename
      - folder
      - observed_at
      - supplied_by
      type: object
    SourceReference:
      additionalProperties: false
      description: A precise citation that can be reopened independently of current state.
      properties:
        digest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Exact derived artifact hash.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        path:
          $ref: '#/components/schemas/WorkspacePath'
          description: Relative path at the resolved source revision.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Resolved source revision.
        selection:
          $ref: '#/components/schemas/Selection'
          description: Resolved page, lines, cells, section, or entire source.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - path
      - revision
      - selection
      type: object
    StartImportRequest:
      additionalProperties: false
      description: Convert finalized uploads into source cards in the user-selected folder.
      properties:
        apply_naming_rules:
          description: Apply the explicit workspace conventions after preview acceptance.
          type: boolean
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        destination:
          description: Relative destination folder; empty for root.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Durable retry identity.
        upload_ids:
          description: Completed upload slots.
          items:
            $ref: '#/components/schemas/UploadId'
          type: array
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - upload_ids
      - destination
      - idempotency_key
      - apply_naming_rules
      type: object
    TenantId:
      pattern: ^[A-Za-z0-9_-]{1,128}$
      type: string
    TextRange:
      additionalProperties: false
      description: A one-based inclusive line range.
      properties:
        end:
          description: Last line, at least start.
          format: uint32
          minimum: 1
          type: integer
        start:
          description: First line, starting at one.
          format: uint32
          minimum: 1
          type: integer
      required:
      - start
      - end
      type: object
    TypeDefinition:
      additionalProperties: false
      description: A user-defined type schema and UI hints.
      properties:
        name:
          description: Exact user-facing OKF type name.
          type: string
        properties_schema:
          description: JSON Schema for type-specific properties.
        schema_version:
          description: Application format version.
          format: uint32
          minimum: 0
          type: integer
        ui_schema:
          description: Presentation hints; never authorization rules.
      required:
      - name
      - schema_version
      - properties_schema
      - ui_schema
      type: object
    UpdateWorkspaceRequest:
      additionalProperties: false
      description: Update workspace presentation metadata at a known revision.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        description:
          description: Updated purpose.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        name:
          description: New display name.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - name
      - description
      - idempotency_key
      type: object
    Upload:
      additionalProperties: false
      description: An authenticated upload slot for a specific source occurrence.
      properties:
        complete:
          description: Whether expected bytes and digest have been verified.
          type: boolean
        id:
          $ref: '#/components/schemas/UploadId'
          description: Upload identity.
        received_bytes:
          description: Durably retained byte count.
          type: string
        upload_path:
          description: Same-origin binary PUT target.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - id
      - workspace_id
      - upload_path
      - received_bytes
      - complete
      type: object
    UploadId:
      description: Identity of one authenticated source upload occurrence.
      format: uuid
      type: string
    ViewBinding:
      additionalProperties: false
      description: |-
        A named source selection used by a chart or layout.

        A saved View binds only to sources in its own workspace: `source.workspace_id` must equal
        the workspace the View is saved or presented in (`ViewDocument::bindings_outside`).
      properties:
        materialized:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Retained dataset bytes for reproducibility.
        name:
          description: Dataset or component binding name.
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Resolved cited input.
        transforms:
          description: Declared allowed data transformations; validated against the selected grammar.
          items: true
          type: array
        units:
          additionalProperties:
            type: string
          description: Column or field units.
          type: object
      required:
      - name
      - source
      - units
      - transforms
      type: object
    ViewDocument:
      additionalProperties: false
      description: An editable visual artifact with prose and explicit source bindings.
      properties:
        bindings:
          description: Cited input datasets and passages.
          items:
            $ref: '#/components/schemas/ViewBinding'
          type: array
        charts:
          additionalProperties: true
          description: Named Vega-Lite specs referenced by `json_render` Chart components; empty for `vega_lite`.
          type: object
        description:
          description: Readable explanation independent of the renderer.
          type: string
        grammar:
          $ref: '#/components/schemas/RenderGrammar'
          description: Declarative renderer grammar.
        mode:
          $ref: '#/components/schemas/ViewMode'
          description: Pinned or explicitly live.
        schema_version:
          description: App-owned format version, currently 1.
          format: uint32
          minimum: 0
          type: integer
        spec:
          description: Validated renderer specification with no arbitrary code or external fetching.
        title:
          description: Human-readable visual title.
          type: string
      required:
      - schema_version
      - title
      - description
      - mode
      - grammar
      - bindings
      - spec
      type: object
    ViewMode:
      description: Pinned historical views and explicit live refresh have different semantics.
      oneOf:
      - const: pinned
        description: All bindings reference retained immutable source revisions.
        type: string
      - const: live
        description: Bindings request current sources and disclose each resolved revision.
        type: string
    Warning:
      additionalProperties: false
      description: A diagnostic that does not silently discard usable input.
      properties:
        code:
          description: Stable diagnostic identifier.
          type: string
        location:
          description: Page, cell, path, or field locator.
          type:
          - string
          - 'null'
        message:
          description: Human-readable explanation.
          type: string
      required:
      - code
      - message
      type: object
    Workspace:
      additionalProperties: false
      description: A user-owned OKF workspace with a resolved head revision.
      properties:
        created_at:
          description: RFC 3339 creation time.
          type: string
        description:
          description: One-line context for people and agents.
          type: string
        head:
          $ref: '#/components/schemas/Revision'
          description: Current resolved Git commit.
        id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Stable application identity.
        name:
          description: Human-selected workspace name.
          type: string
        permissions:
          description: The caller's effective grant on this workspace after any delegation ceiling.
          items:
            $ref: '#/components/schemas/Permission'
          type: array
      required:
      - id
      - name
      - description
      - head
      - created_at
      - permissions
      type: object
    WorkspaceId:
      description: Stable application identity for one user-organized workspace.
      format: uuid
      type: string
    WorkspacePath:
      maxLength: 4096
      minLength: 1
      pattern: ^[^/\\:\x00-\x1f]+(/[^/\\:\x00-\x1f]+)*$
      type: string
  securitySchemes:
    bearerAuth:
      description: 'Hosted: a WorkOS Connect access token. Local: an opaque connector secret issued by create_connector.'
      scheme: bearer
      type: http
    browserSession:
      description: Local-owner or WorkOS browser session; cookie-authenticated writes also require the CSRF token.
      in: cookie
      name: okf-session
      type: apiKey
