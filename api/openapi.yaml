          type: string
        version:
          description: Application build version.
          type: string
      required:
      - status
      - version
      type: object
    IdempotencyKey:
      description: Caller-chosen retry identity for one write, scoped to tenant, subject and operation.
      format: uuid
      type: string
    IssuedConnector:
      additionalProperties: false
      description: A newly issued connector and its secret, which is returned exactly once and never stored in plain text.
      properties:
        connector:
          $ref: '#/components/schemas/Connector'
          description: The issued connector's scope.
        secret:
          description: Bearer secret for the MCP client's configuration.
          type: string
      required:
      - connector
      - secret
      type: object
    ItemDocument:
      additionalProperties: false
      description: Editable Markdown and preserved frontmatter extension properties.
      properties:
        body:
          description: Markdown body, preserving source locators.
          type: string
        draft:
          anyOf:
          - $ref: '#/components/schemas/DraftContent'
          - type: 'null'
          description: The caller's own uncommitted draft; never another editor's, and never on agent routes.
        properties:
          additionalProperties: true
          description: |-
            All user and OKF properties; unknown extension values are retained. The server-owned
            application header appears under `APP_HEADER_KEY`.
          type: object
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceAppearance'
          - type: 'null'
          description: Source occurrence metadata when applicable.
        summary:
          $ref: '#/components/schemas/ItemSummary'
          description: Identity and navigation metadata.
      required:
      - summary
      - body
      - properties
      type: object
    ItemId:
      description: Stable item identity independent of its current relative path.
      format: uuid
      type: string
    ItemKind:
      description: Built-in presentation roles; user-defined OKF type names remain unrestricted.
      oneOf:
      - const: note
        description: Human or agent-authored Markdown knowledge.
        type: string
      - const: source
        description: An appearance of immutable source bytes.
        type: string
      - const: view
        description: A source-bound declarative visual artifact.
        type: string
    ItemStatus:
      description: |-
        OKF's `status` word of an item, distinct from business approval and from archiving.

        An absent OKF `status` reads `stable`. `other` is a producer's value outside the three,
        kept exactly as written in the file's `status` property; it cannot be set through
        `set_lifecycle`.
      oneOf:
      - const: draft
        description: Work in progress.
        type: string
      - const: stable
        description: Current and usable content.
        type: string
      - const: deprecated
        description: Retained, superseded content; still searchable.
        type: string
      - const: other
        description: A status word outside the three, preserved in the file.
        type: string
    ItemSummary:
      additionalProperties: false
      description: A navigable item description bound to a resolved workspace revision.
      properties:
        archived:
          description: Hidden from ordinary current listings; reversible and keeps history.
          type: boolean
        description:
          description: One-line navigation summary.
          type: string
        extraction:
          anyOf:
          - $ref: '#/components/schemas/ExtractionSummary'
