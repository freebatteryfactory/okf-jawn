components:
  schemas:
    AcceptProposalRequest:
      additionalProperties: false
      description: Accept exactly the displayed proposal against an unchanged workspace head.
      properties:
        confirmation_id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Server-issued session-bound confirmation; never a model-supplied reviewer name.
        expected_head:
          $ref: '#/components/schemas/Revision'
          description: Workspace head shown during confirmation.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity; a retry with the same mutation may re-consume its own confirmation.
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: Suggestion identity.
        proposal_revision:
          $ref: '#/components/schemas/Revision'
          description: Proposal version shown during confirmation.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - proposal_id
      - expected_head
      - proposal_revision
      - confirmation_id
      - idempotency_key
      type: object
    AccessRoute:
      description: |-
        How authenticated authority reached the application.

        Local and hosted entry paths both resolve to one of these routes and share the same
        authorization rules; no route is granted authority because the connection is loopback.
      oneOf:
      - const: browser_session
        description: Hosted Explorer session established through WorkOS AuthKit.
        type: string
      - const: mcp_delegation
        description: 'External agent: a WorkOS Connect token when hosted, a local connector credential when local.'
        type: string
      - const: local_owner
        description: The installation-local owner identity, authenticated through the local browser session.
        type: string
      - const: service
        description: Configured internal service identity.
        type: string
    AddCommentRequest:
      additionalProperties: false
      description: Add a discussion comment without recording content verification.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: Suggestion being discussed.
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceReference'
          - type: 'null'
          description: Optional line or range under discussion; the caller must be able to read it.
        text:
          description: Comment text.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - proposal_id
      - text
      - idempotency_key
      type: object
    ApiError:
      additionalProperties: false
      description: A safe error response, not an internal backtrace.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable code for programmatic handling.
        detail:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
          description: Typed context for conflict, replay, and in-progress outcomes.
        field:
          description: Input field needing correction.
          type:
          - string
          - 'null'
        message:
          description: Safe explanation for the caller.
          type: string
        request_id:
          description: Correlation identifier, not a secret.
          type:
          - string
          - 'null'
      required:
      - code
      - message
      type: object
    ApplyNamesRequest:
      additionalProperties: false
      description: Apply a revision-bound preview and rewrite affected links.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        plan:
          $ref: '#/components/schemas/RenamePlan'
          description: Plan revalidated before any writes.
        rules:
          $ref: '#/components/schemas/NamingRules'
          description: Rules whose digest must match the preview.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - plan
      - rules
      - idempotency_key
      type: object
    ArchiveWorkspaceRequest:
      additionalProperties: false
      description: |-
        Archive the workspace without deleting retained content.

        While a workspace is archived, an operation that would change its content or open work on
        it (a commit, a draft, a proposal, an upload, an import or redigest) is refused as
        `conflict`; reads, export, backup, `unarchive_workspace` and purge are allowed.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - idempotency_key
      type: object
    ArtifactId:
      description: Identity of a retained export or backup artifact.
      format: uuid
      type: string
    ArtifactKind:
      description: What a retained artifact is.
      oneOf:
      - const: export
        description: A portable export of a workspace.
        type: string
      - const: workspace_backup
        description: A workspace archive.
        type: string
      - const: installation_backup
        description: 'An installation archive (hosted: one tenant''s).'
        type: string
      - const: view_export
        description: An export of one View.
        type: string
    AssetRole:
      description: What a retained image is.
      oneOf:
      - const: page_image
        description: A render of one whole page (docling page image).
        type: string
      - const: picture
        description: A picture item's own image (docling `PictureItem` image).
        type: string
    At:
      description: A requested version selector; resolved responses contain a `Revision` instead.
      oneOf:
      - additionalProperties: false
        description: Resolve the current accepted workspace head exactly once.
        properties:
          kind:
            const: latest
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Read an explicitly identified historical snapshot.
        properties:
          kind:
            const: revision
            type: string
          revision:
            $ref: '#/components/schemas/Revision'
            description: Exact resolved commit identity.
        required:
        - kind
        - revision
        type: object
    AttentionItem:
      additionalProperties: false
      description: An observation with a useful next action.
      properties:
        action:
          $ref: '#/components/schemas/OperationName'
          description: Suggested existing operation, never executable code.
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Relevant item.
        kind:
          $ref: '#/components/schemas/AttentionKind'
          description: Diagnostic class.
        message:
          description: Concrete explanation.
          type: string
      required:
      - kind
      - message
      - action
      type: object
    AttentionKind:
      description: Known maintenance conditions.
      oneOf:
      - const: broken_link
        description: A reference does not resolve.
        type: string
      - const: stale
        description: '`stale_after` requires checking.'
        type: string
      - const: unreviewed
        description: Agent-authored content has no covering review.
        type: string
      - const: duplicate
        description: Identical bytes have multiple visible appearances.
        type: string
      - const: missing_description
        description: Navigation summary is absent.
        type: string
      - const: unprocessed
        description: A source whose conversion is partial, failed or unsupported; action `redigest_item`.
        type: string
      - const: extraction_warnings
        description: A completed source whose conversion recorded warnings; action `read_item`.
        type: string
      - const: newer_source
        description: A pinned View has newer source data available.
        type: string
      - const: instruction_like
        description: Possible instruction-like source text; advisory only.
        type: string
      - const: invalidated
        description: A saved View or a citation refers to purged content; action `get_view`.
        type: string
      - const: unparseable_header
        description: |-
          An imported file's header does not parse; its bytes are kept and nothing is blocked.
          Action `get_item`.
        type: string
    BackupInstallationRequest:
      additionalProperties: false
      description: |-
        Start an installation archive: identities, tenant grants, connector records without
        secrets, purge records and tenant events; no workspace content.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
      required:
      - idempotency_key
      type: object
    BackupWorkspaceRequest:
      additionalProperties: false
      description: Back up one workspace into one self-contained archive; distinct from portable export.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity for the backup.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - idempotency_key
      type: object
    BlameLine:
      additionalProperties: false
      description: A line and its last recorded content change.
      properties:
        commit:
          $ref: '#/components/schemas/Commit'
          description: Last recorded change.
        line:
          description: One-based line.
          format: uint32
          minimum: 0
          type: integer
        text:
          description: Current text at the selected version.
          type: string
      required:
      - line
      - text
      - commit
      type: object
    BlameRequest:
      additionalProperties: false
      description: Show which commit last changed lines, not who originated each fact.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        lines:
          $ref: '#/components/schemas/TextRange'
          description: Bounded lines.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - lines
      type: object
    BlameResponse:
      additionalProperties: false
      description: Line attribution at an explicit revision.
      properties:
        lines:
          description: Attribution records.
          items:
            $ref: '#/components/schemas/BlameLine'
          type: array
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Selected source.
      required:
      - source
      - lines
      type: object
    BoundingBox:
      additionalProperties: false
      description: Docling's bounding box, copied as the converter gave it (rounded to two decimals).
      properties:
        b:
          description: Bottom edge.
          format: double
          type: number
        coord_origin:
          $ref: '#/components/schemas/CoordOrigin'
          description: Corner `t` and `b` are measured from.
        l:
          description: Left edge.
          format: double
          type: number
        r:
          description: Right edge.
          format: double
          type: number
        t:
          description: Top edge.
          format: double
          type: number
      required:
      - l
      - t
      - r
      - b
      - coord_origin
      type: object
    CancelJobRequest:
      additionalProperties: false
      description: Cancel pending or running work without discarding the uploaded original.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        job_id:
          $ref: '#/components/schemas/JobId'
          description: Job to cancel.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - job_id
      - idempotency_key
      type: object
    CatalogComponent:
      additionalProperties: false
      description: A renderer component with typed props and named supported actions.
      properties:
        actions:
          description: Allowed existing operations.
          items:
            type: string
          type: array
        description:
          description: When to use it.
          type: string
        name:
          description: Canonical component name.
          type: string
        properties_schema:
          description: JSON Schema for props.
      required:
      - name
      - description
      - properties_schema
      - actions
      type: object
    CatalogResponse:
      additionalProperties: false
      description: The presentation vocabulary; it grants no permissions.
      properties:
        components:
          description: Approved components.
          items:
            $ref: '#/components/schemas/CatalogComponent'
          type: array
        schema_version:
          description: Catalog version.
          format: uint32
          minimum: 0
          type: integer
        view_schema:
          description: Schema for persisted View documents.
      required:
      - schema_version
      - components
      - view_schema
      type: object
    CellRange:
      additionalProperties: false
      description: A one-based inclusive rectangular spreadsheet selection; the XLSX source locator.
      properties:
        column_end:
          description: Last column, inclusive.
          format: uint32
          minimum: 1
          type: integer
        column_start:
          description: First column, inclusive, starting at one.
          format: uint32
          minimum: 1
          type: integer
        row_end:
          description: Last row, inclusive.
          format: uint32
          minimum: 1
          type: integer
        row_start:
          description: First row, inclusive, starting at one.
          format: uint32
          minimum: 1
          type: integer
        sheet:
          description: Exact sheet name.
          type: string
      required:
      - sheet
      - row_start
      - row_end
      - column_start
      - column_end
      type: object
    Change:
      description: Permitted proposal mutations; no review or acceptance variants exist.
      oneOf:
      - additionalProperties: false
        description: Create a note or View with retained properties.
        properties:
          body:
            description: Body.
            type: string
          kind:
            const: create
            type: string
          path:
            $ref: '#/components/schemas/WorkspacePath'
            description: Path.
          properties:
            additionalProperties: true
            description: Properties.
            type: object
          type_name:
            description: Type name.
            type: string
        required:
        - kind
        - path
        - type_name
        - body
        - properties
        type: object
      - additionalProperties: false
        description: Replace authored content with preconditions.
        properties:
          body:
            description: Body.
            type: string
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: edit
            type: string
          properties:
            additionalProperties: true
            description: Properties.
            type: object
        required:
        - kind
        - item_id
        - body
        - properties
        type: object
      - additionalProperties: false
        description: Move and rewrite links.
        properties:
          destination:
            $ref: '#/components/schemas/WorkspacePath'
            description: Destination.
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: move
            type: string
        required:
        - kind
        - item_id
        - destination
        type: object
      - additionalProperties: false
        description: Retire an item without deleting retained objects.
        properties:
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Item id.
          kind:
            const: archive
            type: string
        required:
        - kind
        - item_id
        type: object
      - additionalProperties: false
        description: Propose the complete text of an unprocessed source.
        properties:
          based_on:
            anyOf:
            - $ref: '#/components/schemas/Digest'
            - type: 'null'
            description: Digest the agent saw; absent when the source has none. A different current digest is a conflict.
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Source item.
          kind:
            const: supply_extraction
            type: string
          markdown:
            description: The complete proposed text, Markdown.
            type: string
          pages:
            description: Pages the text covers, as the agent claims; empty for the whole.
            items:
              $ref: '#/components/schemas/PageRange'
            type: array
        required:
        - kind
        - item_id
        - markdown
        type: object
    ChartFailure:
      description: Why one chart cannot be drawn.
      oneOf:
      - const: invalid_spec
        description: The Vega-Lite specification fails server validation.
        type: string
      - const: unknown_binding
        description: The chart reads a dataset name no binding declares.
        type: string
      - const: dataset_unavailable
        description: A binding's data could not be resolved or materialized.
        type: string
      - const: invalidated
        description: A binding cites purged content.
        type: string
      - const: too_large
        description: The dataset exceeds the row or byte limit.
        type: string
    ChartRef:
      description: Which chart of a View a result is about.
      oneOf:
      - additionalProperties: false
        description: The View's own `spec`, for `vega_lite` grammar.
        properties:
          kind:
            const: spec
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: A named entry of `ViewDocument::charts`, for `json_render` grammar.
        properties:
          kind:
            const: named
            type: string
          name:
            description: The key in `charts`.
            type: string
        required:
        - kind
        - name
        type: object
    ChartResult:
      additionalProperties: false
      description: One chart and its state.
      properties:
        chart:
          $ref: '#/components/schemas/ChartRef'
          description: Which chart.
        status:
          $ref: '#/components/schemas/ChartStatus'
          description: Its state.
      required:
      - chart
      - status
      type: object
    ChartStatus:
      description: The state of one chart in a present or resolve result.
      oneOf:
      - additionalProperties: false
        description: Every dataset it reads is materialized.
        properties:
          bindings:
            description: Binding names it reads.
            items:
              type: string
            type: array
          status:
            const: ready
            type: string
        required:
        - status
        - bindings
        type: object
      - additionalProperties: false
        description: It cannot be drawn; the View's text and other charts are unaffected.
        properties:
          binding:
            description: The binding at fault, when one is.
            type:
            - string
            - 'null'
          message:
            description: Safe explanation for the chart's own alert.
            type: string
          reason:
            $ref: '#/components/schemas/ChartFailure'
            description: Typed cause.
          status:
            const: failed
            type: string
        required:
        - status
        - reason
        - message
        type: object
    CollisionPolicy:
      description: How proposed naming collisions are handled.
      oneOf:
      - const: reject
        description: Require an explicit decision.
        type: string
      - const: suffix
        description: Add a deterministic suffix.
        type: string
      - const: keep_existing
        description: Keep the original name and report the collision.
        type: string
    ColumnKind:
      description: The data kind of one column.
      oneOf:
      - const: string
        description: Text.
        type: string
      - const: number
        description: A real number.
        type: string
      - const: integer
        description: A whole number.
        type: string
      - const: boolean
        description: True or false.
        type: string
      - const: date_time
        description: |-
          A UTC instant in the canonical `Timestamp` spelling; an ambiguous document date stays a
          `string` (SPEC section 3).
        type: string
    Comment:
      additionalProperties: false
      description: A server-attributed discussion entry.
      properties:
        author:
          description: Authenticated subject.
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Creation time.
        id:
          description: Comment identity.
          type: string
        invalidated_by:
          anyOf:
          - $ref: '#/components/schemas/PurgeId'
          - type: 'null'
          description: The purge that invalidated the comment's `source`, whose stored path was scrubbed.
        text:
          description: Discussion text.
          type: string
      required:
      - id
      - author
      - text
      - created_at
      type: object
    Commit:
      additionalProperties: false
      description: A content snapshot, not a complete application event log.
      properties:
        author:
          description: Git author label, not verified human identity.
          type: string
        committed_at:
          $ref: '#/components/schemas/Timestamp'
          description: Commit time, converted to UTC from the commit's own offset.
        message:
          description: Commit message.
          type: string
        parents:
          description: Parent commits.
          items:
            $ref: '#/components/schemas/Revision'
          type: array
        revision:
          $ref: '#/components/schemas/Revision'
          description: Commit identity.
      required:
      - revision
      - parents
      - message
      - author
      - committed_at
      type: object
    CommitRequest:
      additionalProperties: false
      description: |-
        Snapshot the caller's drafts of the selected items in one commit.

        Each draft's own base revision is the precondition. The Snapshot is blocked only when an
        item being snapshotted was itself changed or deleted since its draft's base; head movement
        that did not touch a selected item never blocks. When blocked, nothing is committed and the
        `draft_conflict` error detail lists every conflicting item, not only the first. On success
        the snapshotted drafts are removed.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_ids:
          description: Items whose drafts by the caller are snapshotted together.
          items:
            $ref: '#/components/schemas/ItemId'
          minItems: 1
          type: array
        message:
          description: Human-readable snapshot name.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_ids
      - message
      - idempotency_key
      type: object
    CompleteUploadRequest:
      additionalProperties: false
      description: Verify upload length and hash without silently creating duplicate occurrences.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        sha256:
          $ref: '#/components/schemas/Digest'
          description: Expected full-content hash.
        upload_id:
          $ref: '#/components/schemas/UploadId'
          description: Upload to finalize.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - upload_id
      - sha256
      - idempotency_key
      type: object
    Confirmation:
      additionalProperties: false
      description: A short-lived challenge; issuance alone is not a review.
      properties:
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: Expiration.
        id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Opaque session-bound challenge.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Bound revision.
      required:
      - id
      - expires_at
      - revision
      type: object
    ConfirmationAction:
      description: The explicit human action a confirmation authorizes; never an arbitrary method.
      oneOf:
      - const: review
        description: Record a content review; requires the review permission.
        type: string
      - const: accept_proposal
        description: Accept a proposal; requires the approve permission.
        type: string
    ConfirmationId:
      description: Identity of one session-bound human confirmation challenge.
      format: uuid
      type: string
    ConfirmationTarget:
      description: The immutable object a confirmation is bound to.
      oneOf:
      - additionalProperties: false
        description: An item revision being reviewed.
        properties:
          item_id:
            $ref: '#/components/schemas/ItemId'
            description: Reviewed item.
          kind:
            const: item
            type: string
        required:
        - kind
        - item_id
        type: object
      - additionalProperties: false
        description: A proposal revision being accepted.
        properties:
          kind:
            const: proposal
            type: string
          proposal_id:
            $ref: '#/components/schemas/ProposalId'
            description: Accepted proposal.
        required:
        - kind
        - proposal_id
        type: object
    Connector:
      additionalProperties: false
      description: A local MCP connector credential's scope, without its secret.
      properties:
        connector_id:
          $ref: '#/components/schemas/ConnectorId'
          description: Stable connector identity.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: Issue time.
        label:
          description: Owner-chosen name.
          type: string
        permissions:
          description: 'Granted capabilities: `read`, plus `propose` only when enabled.'
          items:
            $ref: '#/components/schemas/Permission'
          type: array
        revoked_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Revocation time; a revoked connector authenticates nothing.
        workspace_ids:
          description: Workspaces the connector may access.
          items:
            $ref: '#/components/schemas/WorkspaceId'
          type: array
      required:
      - connector_id
      - label
      - workspace_ids
      - permissions
      - created_at
      type: object
    ConnectorId:
      description: Identity of one local MCP connector credential, never the owner's browser session.
      format: uuid
      type: string
    ConversionOutcome:
      description: What the converter did; supplied text and corrections never change it.
      oneOf:
      - additionalProperties: false
        description: Accepted; the card was committed before conversion and shows no text.
        properties:
          status:
            const: pending
            type: string
        required:
        - status
        type: object
      - additionalProperties: false
        description: Docling's `Success`.
        properties:
          status:
            const: completed
            type: string
        required:
        - status
        type: object
      - additionalProperties: false
        description: Docling's `PartialSuccess`, or a windowed conversion with windows not converted.
        properties:
          coverage:
            anyOf:
            - $ref: '#/components/schemas/PageCoverage'
            - type: 'null'
            description: Pages converted and not converted; absent for a format docling converts whole.
          issues:
            description: Why it is partial, as the converter recorded it.
            items:
              $ref: '#/components/schemas/ConverterIssue'
            type: array
          status:
            const: partial
            type: string
        required:
        - status
        - issues
        type: object
      - additionalProperties: false
        description: No document was produced.
        properties:
          issues:
            description: What the converter recorded, when it recorded anything.
            items:
              $ref: '#/components/schemas/ConverterIssue'
            type: array
          reason:
            $ref: '#/components/schemas/FailureReason'
            description: Typed cause; never the converter's raw text alone.
          status:
            const: failed
            type: string
        required:
        - status
        - reason
        - issues
        type: object
      - additionalProperties: false
        description: No converter handles this format (docling `UnknownFormat` or `UnsupportedFormat`).
        properties:
          status:
            const: unsupported
            type: string
        required:
        - status
        type: object
    ConversionSettings:
      additionalProperties: false
      description: |-
        Converter settings; part of the identity of the digest they produce.

        `Default` is a Rust convenience for a deployment's defaults, never a serde default: every
        field is required on the wire.
      properties:
        ocr:
          $ref: '#/components/schemas/OcrPolicy'
          description: When recognition runs.
        ocr_language:
          description: Docling `ocr_lang`, such as `en` or `ch`; absent uses docling's default (`en`).
          type:
          - string
          - 'null'
        page_image_dpi:
          description: |-
            Render resolution; docling `images_scale` = this / 72. At most 144, docling's own render
            resolution: a higher scale only upsamples that render and adds no detail.
          format: uint16
          maximum: 144
          minimum: 36
          type: integer
        page_images:
          description: Keep a render of every page (docling `generate_page_images`).
          type: boolean
        table_structure:
          description: Reconstruct table structure with the model (docling `no_table_former` off).
          type: boolean
      required:
      - ocr
      - table_structure
      - page_images
      - page_image_dpi
      type: object
    ConverterIdentity:
      additionalProperties: false
      description: The converter that produced a digest; part of the digest's identity (SPEC section 4).
      properties:
        models:
          description: |-
            Model files the pipeline loads, hashed once when the worker starts; empty for formats
            that load none.
          items:
            $ref: '#/components/schemas/ModelIdentity'
          type: array
        name:
          description: '`docling`.'
          type: string
        packages:
          description: |-
            The converter crates as Cargo.lock resolves them; a patched fork is visible here.
            Generated from Cargo.lock by xtask into `generated/converter/packages.json`, so
            gen-check holds it to the lock.
          items:
            $ref: '#/components/schemas/ConverterPackage'
          type: array
        page_window:
          description: Pages per conversion window; absent when the document was converted whole.
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        settings:
          $ref: '#/components/schemas/ConversionSettings'
          description: Settings applied.
        version:
          description: The docling crate version, such as `1.93.5`.
          type: string
      required:
      - name
      - version
      - packages
      - settings
      - models
      type: object
    ConverterIssue:
      additionalProperties: false
      description: Docling's `ErrorItem`, with its own field names.
      properties:
        component_type:
          description: '`document_backend`, `model`, `doc_assembler` or `user_input`.'
          type: string
        error_message:
          description: The converter's message, with every worker filesystem path reduced to its file name.
          type: string
        module_name:
          description: Stage that recorded it, such as `pipeline`.
          type: string
      required:
      - component_type
      - module_name
      - error_message
      type: object
    ConverterPackage:
      additionalProperties: false
      description: One converter crate, as Cargo.lock records it.
      properties:
        name:
          description: Crate name, such as `docling-pdf`.
          type: string
        source:
          description: Cargo.lock `source`, such as `git+https://github.com/Heyoub/docling.rs?rev=...`.
          type: string
        version:
          description: Crate version.
          type: string
      required:
      - name
      - version
      - source
      type: object
    CoordOrigin:
      description: 'Docling''s `coord_origin`: which corner `t` and `b` are measured from.'
      oneOf:
      - const: top_left
        description: Docling `TOPLEFT`.
        type: string
      - const: bottom_left
        description: Docling `BOTTOMLEFT`.
        type: string
    CorrectDigestRequest:
      additionalProperties: false
      description: Record human corrections separately from the generated extraction.
      properties:
        adopts:
          anyOf:
          - $ref: '#/components/schemas/ProposalId'
          - type: 'null'
          description: |-
            Keep the accepted agent-supplied text of this proposal over a later complete
            conversion: `corrected_markdown` must equal that text (compared by digest), and the
            result records who kept it instead of a correction.
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        corrected_markdown:
          description: Corrected text kept separate from generated text.
          type: string
        digest:
          $ref: '#/components/schemas/Digest'
          description: Digest being corrected.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - digest
      - corrected_markdown
      - idempotency_key
      type: object
    CreateConfirmationRequest:
      additionalProperties: false
      description: Prepare explicit human confirmation bound to an action and immutable target.
      properties:
        action:
          $ref: '#/components/schemas/ConfirmationAction'
          description: Confirmed action; it determines the required permission.
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Displayed content digest.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Displayed content revision.
        target:
          $ref: '#/components/schemas/ConfirmationTarget'
          description: Item or proposal being confirmed.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - action
      - target
      - revision
      - content_digest
      - idempotency_key
      type: object
    CreateConnectorRequest:
      additionalProperties: false
      description: Issue a scoped credential for a local MCP client; read-only unless propose is enabled.
      properties:
        allow_propose:
          description: Also grant proposal creation. Review and approval are never grantable to a connector.
          type: boolean
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity; a replay returns `already_issued`, never the secret again.
        label:
          description: Owner-chosen name identifying the client, such as the host application.
          type: string
        workspace_ids:
          description: Workspaces the connector may read; each must already be accessible to the owner.
          items:
            $ref: '#/components/schemas/WorkspaceId'
          type: array
      required:
      - label
      - workspace_ids
      - allow_propose
      - idempotency_key
      type: object
    CreateFolderRequest:
      additionalProperties: false
      description: Create a user-selected folder and its navigable index.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        folder:
          $ref: '#/components/schemas/WorkspacePath'
          description: New relative folder path.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - folder
      - idempotency_key
      type: object
    CreateItemRequest:
      additionalProperties: false
      description: Create a note or View without altering source bytes.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        body:
          description: Markdown content.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        kind:
          $ref: '#/components/schemas/ItemKind'
          description: Built-in role.
        path:
          $ref: '#/components/schemas/WorkspacePath'
          description: Destination relative path.
        properties:
          additionalProperties: true
          description: Preserved extension properties.
          type: object
        title:
          description: Display title.
          type: string
        type_name:
          description: User-selected OKF type.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - base_revision
      - path
      - title
      - type_name
      - kind
      - body
      - properties
      - idempotency_key
      type: object
    CreateReviewRequest:
      additionalProperties: false
      description: Record an explicit review of a displayed revision, without approving its business claims.
      properties:
        confirmation_id:
          $ref: '#/components/schemas/ConfirmationId'
          description: Session-bound confirmation issued for this revision.
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest displayed in the review confirmation.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        source:
          $ref: '#/components/schemas/SourceReference'
          description: Exact source shown.
      required:
      - source
      - content_digest
      - confirmation_id
      - idempotency_key
      type: object
    CreateSandboxCapabilityRequest:
      additionalProperties: false
      description: Request a short-lived sandbox-origin URL for one hostile representation.
      properties:
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        object:
          $ref: '#/components/schemas/Digest'
          description: Original or derived object served; it must belong to this item revision.
        revision:
          $ref: '#/components/schemas/Revision'
          description: Exact resolved revision whose representation is served.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - revision
      - object
      type: object
    CreateUploadRequest:
      additionalProperties: false
      description: Register immutable upload intent before streaming bytes.
      properties:
        filename:
          description: Original filename, preserved.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        relative_path:
          description: Supplied folder context.
          type: string
        sha256:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: Expected content hash if caller knows it.
        size:
          description: Expected decimal byte count.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - filename
      - relative_path
      - size
      - idempotency_key
      type: object
    CreateWorkspaceRequest:
      additionalProperties: false
      description: Create a blank workspace without baked-in example content.
      properties:
        description:
          description: Purpose of this workspace.
          type: string
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Caller-chosen retry identity.
        name:
          description: Display name.
          type: string
      required:
      - name
      - description
      - idempotency_key
      type: object
    Dataset:
      additionalProperties: false
      description: |-
        A typed table resolved from cited application data; its canonical JSON bytes are the blob
        `ViewBinding::materialized` names.
      properties:
        columns:
          description: Columns, in order.
          items:
            $ref: '#/components/schemas/DatasetColumn'
          maxItems: 1024
          minItems: 1
          type: array
        rows:
          description: Rows; each has exactly one value per column.
          items:
            items:
              $ref: '#/components/schemas/DatasetValue'
            type: array
          maxItems: 100000
          type: array
        schema_version:
          description: Format version, currently 1.
          format: uint32
          minimum: 0
          type: integer
        source:
          $ref: '#/components/schemas/SourceReference'
          description: The exact citation the rows were read from.
        text_origin:
          $ref: '#/components/schemas/TextOrigin'
          description: Whose text the values were read from.
        warnings:
          description: |-
            Extraction warnings of the source that bear on these values, such as
            `cell_values_only` for a dataset read from spreadsheet cells.
          items:
            $ref: '#/components/schemas/ExtractionWarning'
          type: array
      required:
      - schema_version
      - source
      - text_origin
      - columns
      - rows
      type: object
    DatasetColumn:
      additionalProperties: false
      description: One column of a dataset.
      properties:
        kind:
          $ref: '#/components/schemas/ColumnKind'
          description: Data kind.
        name:
          description: Field name a chart encodes.
          type: string
        unit:
          description: Unit, such as `EUR` or `kg`.
          type:
          - string
          - 'null'
      required:
      - name
      - kind
      type: object
    DatasetValue:
      anyOf:
      - description: Missing.
        type: 'null'
      - description: A boolean.
        type: boolean
      - description: A number, kept exact.
        type: number
      - description: Text, or a `Timestamp` for a `date_time` column.
        type: string
      description: |-
        One cell: a JSON scalar of its column's kind, or null. Untagged because a tag per cell would
        multiply the dataset's size; the only untagged enum on the wire.
    DateOrder:
      description: Declared date interpretation; ambiguous input is not guessed.
      oneOf:
      - const: ymd
        description: Year, month, day.
        type: string
      - const: mdy
        description: Month, day, year.
        type: string
      - const: dmy
        description: Day, month, year.
        type: string
      - const: reject_ambiguous
        description: Require unambiguous dates or a human choice.
        type: string
    DeclineProposalRequest:
      additionalProperties: false
      description: Close a proposal without changing accepted content.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        proposal_id:
          $ref: '#/components/schemas/ProposalId'
          description: Suggestion identity.
        reason:
          description: Human-readable closure reason.
          type: string
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - proposal_id
      - reason
      - idempotency_key
      type: object
    DelegationCeiling:
      additionalProperties: false
      description: Upper bound on what a delegated client may do; it only narrows grants, never adds to them.
      properties:
        permissions:
          description: Capabilities the delegation may exercise; effective permission is the intersection with grants.
          items:
            $ref: '#/components/schemas/Permission'
          type: array
        workspace_ids:
          description: Workspaces the delegation is limited to; absent means no restriction beyond the delegator's grants.
          items:
            $ref: '#/components/schemas/WorkspaceId'
          type:
          - array
          - 'null'
      required:
      - permissions
      type: object
    DeleteItemRequest:
      additionalProperties: false
      description: Remove the active item reference while retaining historical objects.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Exact revision on which this change is based; stale writes conflict.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - base_revision
      - idempotency_key
      type: object
    DependencyStatus:
      additionalProperties: false
      description: One configured dependency status.
      properties:
        message:
          description: Diagnostic explanation without secrets.
          type: string
        name:
          description: Dependency name.
          type: string
        ready:
          description: Whether required checks succeeded.
          type: boolean
      required:
      - name
      - ready
      - message
      type: object
    DiffRequest:
      additionalProperties: false
      description: Compare two explicitly resolved snapshots.
      properties:
        from:
          $ref: '#/components/schemas/Revision'
          description: Base version.
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Optional item filter.
        to:
          $ref: '#/components/schemas/Revision'
          description: Compared version.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - from
      - to
      type: object
    DiffResponse:
      additionalProperties: false
      description: A comparison tied to both source revisions.
      properties:
        changes:
          description: Changed content.
          items:
            $ref: '#/components/schemas/FileChange'
          type: array
        from:
          $ref: '#/components/schemas/Revision'
          description: Base commit.
        to:
          $ref: '#/components/schemas/Revision'
          description: Compared commit.
        warnings:
          description: Limits or unsupported binary comparison details.
          items:
            $ref: '#/components/schemas/Warning'
          type: array
      required:
      - from
      - to
      - changes
      - warnings
      type: object
    Digest:
      pattern: ^[0-9a-f]{64}$
      type: string
    DiscardDraftRequest:
      additionalProperties: false
      description: Remove the caller's own draft of one item.
      properties:
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - idempotency_key
      type: object
    DownloadArtifact:
      additionalProperties: false
      description: An authorized export or backup artifact with integrity metadata.
      properties:
        artifact_id:
          $ref: '#/components/schemas/ArtifactId'
          description: Stable downloadable artifact.
        download_path:
          description: |-
            Application-relative authorized download path:
            `/api/workspaces/{workspace_id}/artifacts/{artifact_id}` for a workspace artifact,
            `/api/artifacts/{artifact_id}` for a tenant artifact.
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
          description: What the artifact is; it decides the download permission and routes.
        sha256:
          $ref: '#/components/schemas/Digest'
          description: Digest of the archive.
        size:
          description: Byte count as a decimal string to preserve integer precision.
          type: string
      required:
      - artifact_id
      - kind
      - sha256
      - size
      - download_path
      type: object
    Draft:
      additionalProperties: false
      description: Saved draft metadata; one per (item, editor), and never a revision.
      properties:
        base_revision:
          $ref: '#/components/schemas/Revision'
          description: Head revision the draft is based on; a Snapshot conflicts if the item changed since.
        content_digest:
          $ref: '#/components/schemas/Digest'
          description: Digest of the drafted body and properties.
        editor:
          description: Server-established subject who owns this draft.
          type: string
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Drafted item.
        saved_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time of the latest save.
      required:
      - item_id
      - editor
      - base_revision
      - content_digest
      - saved_at
      type: object
    DraftConflictItem:
      additionalProperties: false
      description: |-
        One snapshotted item whose committed content moved after its draft's base.

        The editor resolves it per item, with `changes` as the diff: keep mine is `save_draft` with
        `base_revision` = `current_revision`, then `commit_items`; take theirs is `discard_draft`.
      properties:
        changes:
          description: The item's committed changes from `draft_base` to `current_revision`.
          items:
            $ref: '#/components/schemas/FileChange'
          type: array
        current_revision:
          $ref: '#/components/schemas/Revision'
          description: Head revision at which the item was found changed or deleted.
        deleted:
          description: The item no longer exists at `current_revision`.
          type: boolean
        draft_base:
          $ref: '#/components/schemas/Revision'
          description: Revision the draft was based on.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Item whose draft no longer applies cleanly.
      required:
      - item_id
      - draft_base
      - current_revision
      - deleted
      - changes
      type: object
    DraftContent:
      additionalProperties: false
      description: The caller's own draft content returned beside committed content.
      properties:
        body:
          description: Drafted Markdown body.
          type: string
        draft:
          $ref: '#/components/schemas/Draft'
          description: Draft metadata.
        properties:
          additionalProperties: true
          description: Drafted complete property map.
          type: object
      required:
      - draft
      - body
      - properties
      type: object
    DuplicateObservation:
      additionalProperties: false
      description: |-
        One path observed as a duplicate during rename preview, including paths that differ only in
        case or Unicode normalization (`WorkspacePath::collision_key`).
      properties:
        item_ids:
          description: Item identities that collide on that path.
          items:
            $ref: '#/components/schemas/ItemId'
          type: array
        message:
          description: Human-readable observation without mutating content.
          type: string
        path:
          $ref: '#/components/schemas/WorkspacePath'
          description: Path observed more than once.
      required:
      - path
      - item_ids
      - message
      type: object
    Empty:
      additionalProperties: false
      description: An empty request object.
      type: object
    ErrorCode:
      description: Stable failure classifications; HTTP and MCP adapters preserve these.
      oneOf:
      - const: invalid_input
        description: Input violates the declared contract.
        type: string
      - const: unauthenticated
        description: No acceptable identity was established.
        type: string
      - const: forbidden
        description: The principal lacks the required capability.
        type: string
      - const: not_found
        description: The resource is absent or not visible to this principal.
        type: string
      - const: conflict
        description: A precondition, revision, draft-base, or idempotency-key conflict occurred.
        type: string
      - const: already_issued
        description: A secret-bearing write already completed; replaying it never returns the secret again.
        type: string
      - const: in_progress
        description: Another attempt with the same idempotency key holds a live lease; retry later.
        type: string
      - const: too_large
        description: A configured resource limit was exceeded.
        type: string
      - const: unsupported
        description: The requested representation or format is unsupported.
        type: string
      - const: unavailable
        description: A configured integration is unavailable.
        type: string
      - const: cancelled
        description: The operation was cancelled.
        type: string
      - const: internal
        description: An unexpected server failure occurred without exposing secrets.
        type: string
      - const: not_implemented
        description: The operation is declared but this build does not implement it; never a success.
        type: string
    ErrorDetail:
      description: Typed failure context the UI and agents can act on without parsing messages.
      oneOf:
      - additionalProperties: false
        description: The connector was already issued under this idempotency key; its secret is not replayed.
        properties:
          connector_id:
            $ref: '#/components/schemas/ConnectorId'
            description: Connector created by the original request.
          kind:
            const: already_issued
            type: string
        required:
        - kind
        - connector_id
        type: object
      - additionalProperties: false
        description: An identical request is executing under a live lease.
        properties:
          kind:
            const: in_progress
            type: string
          mutation_id:
            $ref: '#/components/schemas/MutationId'
            description: Mutation holding the lease.
          retry_after:
            description: Whole seconds the caller should wait before retrying the same request.
            format: uint32
            minimum: 0
            type: integer
        required:
        - kind
        - mutation_id
        - retry_after
        type: object
      - additionalProperties: false
        description: One or more snapshotted items changed or were deleted after their drafts' bases.
        properties:
          items:
            description: Every conflicting item, never only the first.
            items:
              $ref: '#/components/schemas/DraftConflictItem'
            minItems: 1
            type: array
          kind:
            const: draft_conflict
            type: string
        required:
        - kind
        - items
        type: object
      - additionalProperties: false
        description: The idempotency key was reused with a different request body.
        properties:
          kind:
            const: idempotency_conflict
            type: string
          operation:
            $ref: '#/components/schemas/OperationName'
            description: Operation that first used the key.
        required:
        - kind
        - operation
        type: object
      - additionalProperties: false
        description: The named revision was removed or rewritten by a purge; the code is `not_found`.
        properties:
          kind:
            const: invalidated
            type: string
          purge_id:
            $ref: '#/components/schemas/PurgeId'
            description: The purge that removed or rewrote it.
          replacement:
            anyOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
            description: |-
              After an item purge, the rewritten revision to re-pin to; absent after a
              workspace purge.
        required:
        - kind
        - purge_id
        type: object
    Event:
      additionalProperties: false
      description: |-
        A resumable change notification, not canonical content.

        A tenant-level event (a sign-in, a connector issued or revoked, a refusal outside a
        workspace) has no `workspace_id`. Security events carry their `actor`.
      properties:
        actor:
          anyOf:
          - $ref: '#/components/schemas/EventActor'
          - type: 'null'
          description: Who caused it; present on security events.
        at:
          $ref: '#/components/schemas/Timestamp'
          description: When the store recorded it.
        connector_id:
          anyOf:
          - $ref: '#/components/schemas/ConnectorId'
          - type: 'null'
          description: Affected connector.
        id:
          description: Opaque monotonic event cursor.
          type: string
        item_id:
          anyOf:
          - $ref: '#/components/schemas/ItemId'
          - type: 'null'
          description: Affected item.
        job_id:
          anyOf:
          - $ref: '#/components/schemas/JobId'
          - type: 'null'
          description: Affected job.
        kind:
          $ref: '#/components/schemas/EventKind'
          description: What changed.
        operation:
          anyOf:
          - $ref: '#/components/schemas/OperationName'
          - type: 'null'
          description: The refused operation of a `permission_denied` event.
        revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
          description: Content revision when applicable.
        workspace_id:
          anyOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - type: 'null'
          description: Workspace whose permissions and storage scope apply; absent for a tenant-level event.
      required:
      - id
      - kind
      - at
      type: object
    EventActor:
      additionalProperties: false
      description: Who caused a security event.
      properties:
        client_id:
          description: OAuth or connector client.
          type:
          - string
          - 'null'
        route:
          $ref: '#/components/schemas/AccessRoute'
          description: Route it came by.
        subject:
          description: Authenticated subject.
          type: string
      required:
      - subject
      - route
      type: object
    EventKind:
      description: Kinds of workspace change notification.
      oneOf:
      - const: changed
        description: Committed content changed.
        type: string
      - const: imported
        description: An import produced items.
        type: string
      - const: job_updated
        description: A job's durable state changed.
        type: string
      - const: reviewed
        description: A review was recorded.
        type: string
      - const: proposal_updated
        description: A proposal's state or discussion changed.
        type: string
      - const: connector_issued
        description: A local connector credential was issued (tenant-level).
        type: string
      - const: connector_revoked
        description: A local connector credential was revoked (tenant-level).
        type: string
      - const: signed_in
        description: A browser session began (tenant-level).
        type: string
      - const: permission_denied
        description: An authenticated request was refused for lack of a grant or by its route.
        type: string
    ExportViewRequest:
      additionalProperties: false
      description: Export the visual specification, sources, data table, and rendering assets.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity.
        item_id:
          $ref: '#/components/schemas/ItemId'
          description: Stable application item identity; paths remain the portable OKF identity.
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - item_id
      - at
      - idempotency_key
      type: object
    ExportWorkspaceRequest:
      additionalProperties: false
      description: |-
        Export portable OKF content and all selected referenced assets.

        Committed content at one revision with the originals and retained derivatives it
        references, and its history when asked. A current app review is written into its item's
        header as an OKF `verified` entry. Drafts, sessions and credentials are never included.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
          description: Retry identity for the export job.
        include_history:
          description: Include retained Git history in addition to the selected state.
          type: boolean
        workspace_id:
          $ref: '#/components/schemas/WorkspaceId'
          description: Workspace whose permissions and storage scope apply.
      required:
      - workspace_id
      - at
      - include_history
      - idempotency_key
      type: object
    ExtensionPolicy:
      description: How filename extensions are handled when applying a naming rule.
      oneOf:
      - const: preserve
        description: Leave the extension unchanged.
        type: string
      - const: lowercase
        description: Lower-case the extension.
        type: string
      - const: strip
        description: Drop the extension from the normalized note path (never from originals).
        type: string
    Extraction:
      additionalProperties: false
      description: Everything recorded about turning one source occurrence's bytes into text.
      properties:
        converter:
          anyOf:
          - $ref: '#/components/schemas/ConverterIdentity'
          - type: 'null'
          description: Present exactly when a converter ran (not for `pending` or `unsupported`).
        corrected:
          description: A human correction is shown over that text.
          type: boolean
        digest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
          description: |-
            The retained conversion record; present exactly when a document was produced
            (`completed`, `partial`).
        outcome:
          $ref: '#/components/schemas/ConversionOutcome'
          description: What the converter did.
        page_count:
          description: Pages in the original, for a paginated format.
          format: uint32
          minimum: 0
          type:
          - integer
          - 'null'
        supplied:
          anyOf:
          - $ref: '#/components/schemas/SuppliedText'
          - type: 'null'
          description: The latest accepted agent-supplied text, shown or kept in history.
        text_origin:
          $ref: '#/components/schemas/TextOrigin'
          description: Whose text is shown.
        warnings:
          description: Findings of the conversion.
          items:
            $ref: '#/components/schemas/ExtractionWarning'
          type: array
      required:
      - outcome
      - text_origin
      - corrected
      - warnings
      type: object
    ExtractionFilter:
      description: |-
        A filter over sources by extraction.

        One variant on purpose: a defaulted `bool` would split the one wire shape, and `Option<bool>`
        would have a third state with no meaning.
      oneOf:
      - const: unprocessed
        description: |-
          Sources whose converter status is `partial`, `failed` or `unsupported`, whether or not
          text was supplied for them.
        type: string
    ExtractionStatus:
      description: The converter's verdict on one source, as a listing and a filter use it.
      oneOf:
      - const: pending
        description: Accepted; no conversion has finished.
        type: string
      - const: completed
        description: Every page, or the whole non-paginated document, was converted.
        type: string
      - const: partial
        description: A document was produced but part of the source is missing from it.
        type: string
      - const: failed
        description: The converter produced no document; the bytes are retained.
        type: string
      - const: unsupported
        description: No converter exists for this format; the bytes are retained.
        type: string
    ExtractionSummary:
      additionalProperties: false
      description: What a listing shows about one source.
      properties:
        corrected:
          description: A human correction is shown over that text.
          type: boolean
        status:
          $ref: '#/components/schemas/ExtractionStatus'
          description: The converter's verdict.
        text_origin:
          $ref: '#/components/schemas/TextOrigin'
          description: Whose text is shown.
      required:
      - status
      - text_origin
      - corrected
      type: object
    ExtractionWarning:
      description: Findings that leave a document usable but lessen what it says.
      oneOf:
      - additionalProperties: false
        description: Glyphs the PDF's fonts give no Unicode for; detected, not recovered, never indexed as words.
        properties:
          kind:
            const: undecodable_glyphs
            type: string
          pages:
            description: Pages holding placeholders, ascending.
            items:
              $ref: '#/components/schemas/PageGlyphs'
            type: array
          unlocated_glyphs:
            description: Placeholders in items that have no page.
            format: uint32
            minimum: 0
            type: integer
        required:
        - kind
        - pages
        - unlocated_glyphs
        type: object
      - additionalProperties: false
        description: Items located through the page text layer instead of by the converter.
        properties:
          items:
            description: How many.
            format: uint32
            minimum: 0
            type: integer
          kind:
            const: inferred_locations
            type: string
        required:
        - kind
        - items
        type: object
      - additionalProperties: false
        description: Items with no location in the original.
        properties:
          items:
            description: How many.
            format: uint32
            minimum: 0
            type: integer
          kind:
            const: unlocated_items
            type: string
        required:
        - kind
        - items
        type: object
      - additionalProperties: false
        description: |-
          A spreadsheet's cells were read as the values the file stores; formulas and number
          formats were not extracted (SPEC section 5 formula/value/format distinction).
        properties:
          kind:
            const: cell_values_only
            type: string
          sheets:
            description: Sheets read, in workbook order.
            items:
              type: string
            type: array
        required:
        - kind
        - sheets
        type: object
    FailureReason:
      description: Why a conversion produced no document.
      oneOf:
      - additionalProperties: false
        description: |-
          The converter refused the bytes as unreadable: truncated, corrupt, or not what the
          name says (docling `Parse`, `WithSource`, or `Failure`).
        properties:
          kind:
            const: damaged
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: The worker reached its memory cap before any page converted.
        properties:
          kind:
            const: memory_limit
            type: string
          limit_bytes:
            description: The cap, in bytes, as a decimal string.
            type: string
        required:
        - kind
        - limit_bytes
        type: object
      - additionalProperties: false
        description: The worker's hard time bound ended it before any page converted.
        properties:
          kind:
            const: time_limit
            type: string
          limit_seconds:
            description: The bound, in whole seconds.
            format: uint32
            minimum: 0
            type: integer
        required:
        - kind
        - limit_seconds
        type: object
      - additionalProperties: false
        description: The converter process ended abnormally (docling `Panic`, an abort, a signal).
        properties:
          kind:
            const: converter_crashed
            type: string
        required:
        - kind
        type: object
      - additionalProperties: false
        description: Any other converter error (docling `Io`, `Streaming`, `Browser`).
        properties:
          kind:
            const: converter_error
            type: string
        required:
        - kind
        type: object
    FileChange:
      additionalProperties: false
      description: A changed file with before and after locators.
      properties:
        binary:
          description: The underlying bytes are binary.
          type: boolean
        kind:
          $ref: '#/components/schemas/FileChangeKind'
          description: Added, modified, moved, or removed.
        new_path:
          description: New path; absent for deletions.
          type:
          - string
          - 'null'
        old_path:
          description: Previous path; absent for additions.
          type:
          - string
          - 'null'
        patch:
          description: Unified text diff when applicable.
          type: string
      required:
      - patch
      - binary
      - kind
      type: object
    FileChangeKind:
      description: How one file differs between two revisions.
      oneOf:
      - const: added
        description: Present only in the compared revision.
        type: string
      - const: modified
        description: Same path, different content.
        type: string
      - const: moved
        description: Different path for the same item.
        type: string
      - const: removed
        description: Present only in the base revision.
        type: string
    GetAttentionRequest:
      additionalProperties: false
      description: Read workspace diagnostics at an explicit revision.
      properties:
        at:
          $ref: '#/components/schemas/At'
          description: Requested revision selector; latest is resolved once before reading.
        page:
          $ref: '#/components/schemas/PageRequest'
