[package]
name = "okf-jawn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
okf-jawn-contract = { path = "../contract" }
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
schemars.workspace = true
tokio.workspace = true
sha2.workspace = true
uuid.workspace = true
# The naming rules (core::conventions) format dates with `time` format descriptions, version 3,
# which need `formatting`: the workspace entry states it.
time.workspace = true
# Which items a naming rule names: a glob over the workspace path (character-based; matched on
# collision keys, since its own case folding is ASCII only).
glob.workspace = true
# Words and letter case of a name: `split` on space, `-` and `_` only, and `Pattern::mutate`.
convert_case.workspace = true
# Dates and version suffixes recognised in a name.
regex.workspace = true
unicode-normalization.workspace = true
base64.workspace = true
# Conformance and lint are application policy. Call validate_bundle / lint_bundle from
# application operations; do not move this responsibility into storage or ingest.
# okf-core is required because Bundle is not re-exported by the validator.
okf-core.workspace = true
okf-validator.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# Tests must see insertion-ordered JSON maps, as the real server graph does (docling-core).
serde_json = { workspace = true, features = ["preserve_order"] }
