[package]
name = "okf-jawn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
okf-jawn-contract = { path = "../contract" }
okf-jawn-core = { path = "../core" }
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true

workos = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[features]
default = []
runtime = ["dep:workos", "dep:tracing", "dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tower-http", "dep:notify", "dep:directories", "dep:url"]
