[package]
name = "okf-jawn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
okf-jawn-contract = { path = "../contract" }
okf-jawn-core = { path = "../core" }
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Startup composes the concrete adapters; core itself never depends on them.
okf-jawn-storage = { path = "../storage", optional = true, features = ["runtime"] }
okf-jawn-ingest = { path = "../ingest", optional = true, features = ["runtime"] }
okf-jawn-mcp = { path = "../mcp", optional = true }
rmcp = { workspace = true, optional = true }
workos = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["fs", "cors", "csrf"] }
notify = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
url = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
time = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["io"] }
# The binary's three commands (serve, backup, restore).
clap = { workspace = true, optional = true }
# The one outbound client (no redirect, https only) for WorkOS, AuthKit and the Connect key set.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
# Tests sign Connect-shaped tokens with a test-only RSA key (EncodingKey::from_rsa_pem).
jsonwebtoken = { workspace = true, features = ["use_pem"] }

[features]
default = []
runtime = ["dep:okf-jawn-storage", "dep:okf-jawn-ingest", "dep:okf-jawn-mcp", "dep:rmcp", "dep:workos", "dep:tracing", "dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tower-http", "dep:notify", "dep:directories", "dep:url", "dep:cookie", "dep:jsonwebtoken", "dep:getrandom", "dep:time", "dep:serde", "dep:futures-util", "dep:tokio-util", "dep:clap", "dep:reqwest"]
