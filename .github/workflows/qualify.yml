name: Qualification (MCP Apps protocol)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-apps-protocol:
    name: MCP Apps protocol check only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCARF_ANALYTICS: "false"
      OKF_MCP_APPS_PROTOCOL_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the toolchain selected by rust-toolchain.toml
        run: rustup toolchain install
      - run: bun scripts/dev.mjs bootstrap
      - name: MCP Apps protocol qualification (cheap)
        run: bun scripts/dev.mjs qualify mcp-apps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          include-hidden-files: true
          name: qualification-artifacts
          if-no-files-found: warn
          path: |
            .artifacts/qualification/
