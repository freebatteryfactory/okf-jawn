name: Qualification (MCP Apps protocol)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-apps-protocol:
    name: MCP Apps protocol check only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCARF_ANALYTICS: "false"
      OKF_MCP_APPS_PROTOCOL_ONLY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the toolchain selected by rust-toolchain.toml
        run: rustup toolchain install
      - run: bun scripts/dev.mjs bootstrap
      - name: MCP Apps protocol qualification (cheap)
        run: bun scripts/dev.mjs qualify mcp-apps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: qualification-artifacts
          if-no-files-found: warn
          path: |
            .artifacts/qualification/
