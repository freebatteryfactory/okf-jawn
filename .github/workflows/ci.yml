name: Source and foundation diagnostics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-tooling:
    name: Dependency-free source tooling, not product acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun scripts/dev.mjs check-offline
  foundation:
    name: Actual pinned generators and consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCARF_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install the toolchain selected by rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: bun scripts/dev.mjs bootstrap
      - run: bun scripts/dev.mjs foundation
      - run: bun scripts/dev.mjs test
      - run: bun scripts/dev.mjs check
      - run: bun scripts/dev.mjs audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resolved-foundation
          if-no-files-found: error
          path: |
            Cargo.lock
            bun.lock
            api/
            generated/cli/
            ui/src/api/generated/
            ui/dist/
            ui/dist-apps/
  runtime-clippy:
    name: Clippy with runtime features (storage, ingest, server)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the toolchain selected by rust-toolchain.toml
        run: rustup toolchain install
      - name: Clippy runtime feature graph
        run: |
          cargo clippy --locked \
            -p okf-jawn-storage --features runtime \
            -p okf-jawn-ingest --features runtime \
            -p okf-jawn-server --features runtime \
            --all-targets -- -D warnings
