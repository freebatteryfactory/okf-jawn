# Policy for `cargo deny check` (wired from `bun scripts/dev.mjs audit` and CI).
# Duplicate crate versions warn; license and advisory failures deny.

[graph]
# Include runtime feature graphs (storage/ingest/server) in license and advisory checks.
all-features = true

[advisories]
version = 2
ignore = [
  # Transitive through docling/qualification only; no maintained upgrade yet.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, declared by docling-pdf 2.3.0; tracked until docling-pdf drops it" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive only, no drop-in replacement in current graph" },
  # rsa through jsonwebtoken rust_crypto (server). Remove when rsa ships a constant-time release or
  # jsonwebtoken moves off it.
  { id = "RUSTSEC-2023-0071", reason = "Marvin timing affects RSA private-key decryption; okf-jawn only verifies JWT signatures with public JWKS keys (jsonwebtoken rust_crypto)" },
  # zip 8.6.0, patched in 9.0.0, which calamine and docling do not accept yet. Each advisory is in unpacking an
  # archive to disk (`ZipArchive::extract`, `ZipStreamReader::extract`), which nothing here calls; see
  # .cargo/audit.toml and the zip rule of `xtask source-policy`. Remove when calamine and docling accept zip 9.
  { id = "RUSTSEC-2026-0367", reason = "SUID and SGID bits kept by zip extraction to disk; nothing here extracts an archive to disk (storage reads named entries)" },
  { id = "RUSTSEC-2026-0368", reason = "zip extraction to disk creates symlinks outside the destination; nothing here extracts an archive to disk (storage reads named entries)" },
  { id = "RUSTSEC-2026-0369", reason = "zip extraction to disk applies permissions through symlinks; nothing here extracts an archive to disk (storage reads named entries)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  # Appears via winx (cap-std / storage runtime) once all-features pulls the runtime graph.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "NCSA",
  "CDLA-Permissive-2.0",
  # Appears via libbz2-rs-sys (docling/runtime graph) once all-features is enabled.
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
# Deny wildcard versions; path/git deps in private crates and path/git dev-deps are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The docling-pdf fork of Cargo.toml [patch.crates-io] (verification.json gate
# converter-docling-pdf-font-run-patch); the only git source allowed.
allow-git = ["https://github.com/Heyoub/docling.rs"]
