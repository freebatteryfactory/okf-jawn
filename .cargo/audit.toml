# Project cargo-audit policy. Deny informational warnings so unmaintained
# and yanked findings fail the gate unless listed below by exact ID.
#
# Do not add blanket "unmaintained packages are allowed" exemptions.
# Only exact RUSTSEC IDs that remain after OKF feature-slicing and the
# Docling upgrade, with a path, reason, and removal condition.
#
# RUSTSEC-2024-0436 (paste): docling 2.3.0 → image → pulp / rav1e / tokenizers.
# No CVE. Removal: Docling or image crates drop paste, or a maintained replacement.
#
# RUSTSEC-2026-0192 (ttf-parser): docling-pdf 2.3.0 declares it (optional; Cargo.lock lists it).
# No CVE. Removal: docling-pdf drops ttf-parser. RUSTSEC-2026-0206 (rustybuzz) left the lock
# when Docling 2.3.0 moved to resvg 0.48.

[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192"]

[output]
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
format = "terminal"
show_tree = true
