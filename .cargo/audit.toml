# Project cargo-audit policy. Deny informational warnings so unmaintained
# and yanked findings fail the gate unless listed below by exact ID.
#
# Do not add blanket "unmaintained packages are allowed" exemptions.
# Only exact RUSTSEC IDs that remain after OKF feature-slicing and the
# Docling upgrade, with a path, reason, and removal condition.
#
# RUSTSEC-2024-0436 (paste): docling 2.3.0 → image → pulp / rav1e / tokenizers.
# No CVE. Removal: Docling or image crates drop paste, or a maintained replacement.
#
# RUSTSEC-2026-0192 (ttf-parser): docling-pdf 2.3.0 declares it (optional; Cargo.lock lists it).
# No CVE. Removal: docling-pdf drops ttf-parser. RUSTSEC-2026-0206 (rustybuzz) left the lock
# when Docling 2.3.0 moved to resvg 0.48.
#
# RUSTSEC-2023-0071 (rsa): jsonwebtoken 11.1.0 rust_crypto → rsa (server). Marvin timing affects
# RSA private-key decryption; okf-jawn only verifies JWT signatures with public JWKS keys
# (jsonwebtoken rust_crypto). Removal: rsa ships a constant-time release or jsonwebtoken moves off it.
#
# RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369 (zip 8.6.0; patched in 9.0.0): SUID bits kept,
# symlinks to outside the destination, and permissions applied through symlinks, all while unpacking
# an archive to disk with `ZipArchive::extract` or `ZipStreamReader::extract`. Owner decision 2026-10-17.
# Nothing here calls them: storage reads named entries (`by_name`, `by_index`) into files it names
# itself, and calamine 0.36.1 and docling 2.3.0 (each `zip ^8.6`, as is the newest of each) only read
# entries. The zip rule of `xtask source-policy` (xtask/src/source_policy.rs) confines the reader so no
# authored code can extract. Re-check both crates at every bump. Removal: calamine and docling accept zip 9; then storage and ingest take it too.

[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192", "RUSTSEC-2023-0071", "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]

[output]
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
format = "terminal"
show_tree = true
